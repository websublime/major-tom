<script>
(function () {
'use strict'

/* == src/data.mjs == */
// Snapshot parsing and derivations. Everything downstream reads these constants;
// the data island is the only input (templates/README.md, snapshot schema v2).

const AREAS = ['memories', 'docs', 'runs', 'monitors', 'logs']
const KIND_COLOR = { feat: 'var(--accent)', fix: 'var(--stop)', docs: 'var(--dim)', test: 'var(--ok)', chore: 'var(--dimmer)', refactor: 'var(--warn)' }
const TIER_COLOR = { trivial: 'var(--dimmer)', task: 'var(--warn)', substantive: 'var(--accent)' }

function parseIsland() {
  try {
    return JSON.parse(document.getElementById('major-tom-data').textContent || '{}')
  } catch (e) {
    return {}
  }
}

const DATA = parseIsland()
const CFG = DATA.config || {}
const ROOT = (CFG.persistence && CFG.persistence.root) || '.knowledge'

function rel(iso) {
  if (!iso) return ''
  const t = Date.parse(iso)
  if (isNaN(t)) return String(iso)
  const m = Math.round((Date.now() - t) / 60000)
  if (m < 1) return 'now'
  if (m < 60) return m + ' min ago'
  if (m < 1440) return Math.round(m / 60) + ' h ago'
  return Math.round(m / 1440) + ' d ago'
}

function clock(iso) {
  const t = Date.parse(iso)
  if (isNaN(t)) return ''
  const d = new Date(t)
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
}

const COMMITS = (Array.isArray(DATA.git) ? DATA.git : []).map(function (c) {
  const kind = c.kind || (String(c.subject || '').match(/^(feat|fix|docs|test|chore|refactor)/) || [])[1] || 'other'

    subject: c.subject || '', author: c.author || '', add: c.add, del: c.del,
    when: rel(c.date), date: c.date || ''
  }
})

const FILES = ((DATA.knowledge || {}).files || []).map(function (f) {
  return typeof f === 'string' ? { path: f } : f
})

const COUNTS = (function () {
  const out = AREAS.map(function (a) {
    return { label: a, n: FILES.filter(function (f) { return (f.path || '').indexOf(a + '/') === 0 || (f.path || '').indexOf('/' + a + '/') !== -1 }).length }
  })
  out.push({ label: 'concepts', n: FILES.length })
  return out
})()

const DECISIONS = Array.isArray(DATA.decisions) ? DATA.decisions : FILES
  .filter(function (f) { return f.frontmatter && f.frontmatter.type === 'decision' })
  .map(function (f) {
    return {
      id: f.frontmatter.id || f.path, text: f.frontmatter.title || f.path,
      // date precedence mirrors buildDecisions in plugins/major-tom/app/snapshot.js:
      // the declared frontmatter date, the file mtime otherwise. The two derivations of
      // this one field are deliberately coupled, so keep them in step.
      date: f.frontmatter.date || f.updated || '', status: f.frontmatter.status === 'open' ? 'open' : 'closed'
    }

// so a missing or malformed key degrades to an empty view that states what it does not have.
// Commits are deliberately not part of it; the view merges DATA.git in client side.
const TIMELINE = (function () {
  const t = DATA.timeline && typeof DATA.timeline === 'object' && !Array.isArray(DATA.timeline) ? DATA.timeline : null
  const raw = t && Array.isArray(t.events) ? t.events : []
  const events = raw.filter(function (e) { return e && typeof e === 'object' }).map(function (e) {
    const isRun = e.kind === 'run'
    const tier = isRun || e.tier == null ? null : String(e.tier)
    const sid = e.sessionId == null ? '' : String(e.sessionId)
    const ms = Date.parse(e.at)
    return {
      stream: 'event', kind: isRun ? 'run' : 'intent', tier: tier,
      type: isRun || e.type == null ? null : String(e.type),
      color: isRun ? 'var(--ok)' : (TIER_COLOR[tier] || 'var(--dim)'),
      text: e.summary == null ? '' : String(e.summary),
      truncated: e.summaryTruncated === true,
      promptId: e.promptId == null ? '' : String(e.promptId),
      sessionId: sid, session: sid ? sid.slice(0, 8) : '',
      path: e.path == null ? '' : String(e.path),
      date: e.at || '', when: rel(e.at), at: isNaN(ms) ? null : ms
    }
  })
  const w = t && t.window && typeof t.window === 'object' ? t.window : null
  const o = t && t.omitted && typeof t.omitted === 'object' ? t.omitted : null

    present: !!t, events: events,
    window: w ? { days: w.days, floorEvents: w.floorEvents, ceilingEvents: w.ceilingEvents, byteBudget: w.byteBudget } : null,

  }

const ROADMAP = DATA.roadmap && Array.isArray(DATA.roadmap.milestones) ? DATA.roadmap.milestones : []
const LASTRUN = DATA.lastRun || null

/* == src/state.mjs == */
// Mutable UI state and the view registry metadata.


const VIEWS = ['overview', 'roadmap', 'timeline', 'git', 'knowledge', 'config']

const SUBTITLES = {
  overview: 'Lifecycle state, roadmap and knowledge at a glance',
  roadmap: 'Milestones, tasks and open questions',
  timeline: TIMELINE.events.length + '-event window merged with the commit stream',
  git: COMMITS.length + '-commit window from the snapshot',
  knowledge: ROOT + ' as an OKF 0.2 bundle',
  config: 'Single source of truth for every plugin surface'
}

const S = {
  view: 'overview', layout: 'A', rail: localStorage.getItem('mt-rail') !== '0',
  theme: localStorage.getItem('mt-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'),
  filter: 'all', query: '', file: 0, configMode: 'table'
}

const initialHash = (location.hash || '').replace(/^#\/?/, '')
if (VIEWS.indexOf(initialHash) !== -1) S.view = initialHash

/* == src/ui.mjs == */
// Shared fragments: escaping, status colors, reusable row and card builders.


function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  })
}

function statusColor(st) {
  return st === 'done' ? 'var(--ok)' : st === 'active' ? 'var(--accent)' : 'var(--line2)'
}

function commitRow(c) {
  return '<div class="row">'
    + '<span class="chip sha">' + esc(c.sha) + '</span>'
    + '<span style="flex:0 0 58px;color:' + c.kindColor + ';font-size:11px">' + esc(c.kind) + '</span>'
    + '<span class="ellip" style="flex:1 1 auto;min-width:0">' + esc(c.subject) + '</span>'
    + '<span style="flex:0 0 auto;color:var(--dimmer);font-size:11px">' + esc(c.when) + '</span>'
    + '</div>'
}

function milestoneVm(m) {
  const tasks = Array.isArray(m.tasks) ? m.tasks : []
  const done = tasks.filter(function (t) { return t.status === 'done' }).length
  return {
    title: m.title || '', version: m.version || '', status: m.status || 'planned',
    pct: m.pct != null ? m.pct : (tasks.length ? Math.round(done / tasks.length * 100) : 0),
    color: statusColor(m.status), done: done, total: tasks.length, tasks: tasks
  }
}

function decisionRow(d) {
  const open = d.status === 'open'
  return '<div class="row">'
    + '<span class="chip" style="' + (open ? 'border:1px solid var(--line2);color:var(--warn)' : 'background:var(--ok-soft);color:var(--ok)') + '">' + esc(d.id) + '</span>'
    + '<span class="ellip" style="flex:1 1 auto;min-width:0;color:' + (open ? 'var(--text)' : 'var(--dim)') + '">' + esc(d.text) + '</span>'
    + '<span style="flex:0 0 auto;color:var(--dimmer);font-size:11px">' + esc(open ? 'open' : (d.date || '')) + '</span>'
    + '</div>'
}

function phaseVms() {
  if (!LASTRUN || !Array.isArray(LASTRUN.phases)) return null
  return LASTRUN.phases.map(function (p, i) {
    const st = p.status || 'pending'
    return {
      num: String(i + 1).padStart(2, '0'), name: p.name || '', artifact: p.artifact || '', status: st,
      elapsed: p.elapsed || '', color: statusColor(st === 'pending' ? 'planned' : st),
      pct: st === 'done' ? 100 : st === 'active' ? 55 : 0,
      labelColor: st === 'pending' ? 'var(--dimmer)' : 'var(--text)'
    }
  })
}

/* == src/views/timeline.mjs == */
// Timeline: the recorded intent and run stream (snapshot key `timeline`, D41) merged
// client side with the commit stream, newest first, grouped by day and then by session.
// Commits are never duplicated into the key; the merge happens here.



const REASON_TEXT = {
  days: 'days (the day horizon)',
  ceiling: 'ceiling (the event ceiling)',
  bytes: 'bytes (the byte budget)'
}

function stated(v) {
  return v == null || v === '' ? 'not stated' : String(v)
}

function kbBytes(n) {
  const v = Number(n)
  if (n == null || !isFinite(v)) return 'not stated'
  return v >= 1024 ? Math.round(v / 1024) + ' KB' : v + ' bytes'
}

function reasonText(r) {
  if (r == null || r === '') return 'not stated'
  return REASON_TEXT[r] || String(r)
}

function dayKey(ms) {
  if (ms == null) return ''
  const d = new Date(ms)
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
}

function dayLabel(key) {
  if (!key) return 'undated'
  const today = new Date()
  const yesterday = new Date()
  yesterday.setDate(yesterday.getDate() - 1)
  if (key === dayKey(today.getTime())) return 'today'
  if (key === dayKey(yesterday.getTime())) return 'yesterday'
  return key
}

function groupKey(it) {
  return it.stream === 'commit' ? 'commit' : 'session:' + it.session
}

function groupLabel(it) {
  if (it.stream === 'commit') return 'git'
  return it.session ? 'session ' + it.session : 'no session id'
}

// The merged stream: timeline events plus commits, one chronological order, newest first.
// Items with an unparseable date keep their place at the end rather than being dropped.
function timelineStream() {
  const commits = COMMITS.map(function (c) {
    const ms = Date.parse(c.date)
    return {
      stream: 'commit', kind: 'commit', mark: c.sha, label: c.kind, color: c.kindColor,
      text: c.subject, truncated: false, session: '', path: '',
      date: c.date, when: c.when, at: isNaN(ms) ? null : ms
    }
  })
  const events = TIMELINE.events.map(function (e) {
    return {
      stream: 'event', kind: e.kind, mark: e.kind === 'run' ? 'run' : 'intent',
      label: e.kind === 'run' ? '' : (e.tier || 'intent') + (e.type ? ' ' + e.type : ''),
      color: e.color, text: e.text, truncated: e.truncated, session: e.session, path: e.path,
      date: e.date, when: e.when, at: e.at
    }
  })
  return events.concat(commits).sort(function (a, b) {
    if (a.at == null && b.at == null) return 0
    if (a.at == null) return 1
    if (b.at == null) return -1
    return b.at - a.at
  })
}

// One row of the merged stream, at the density of commitRow and decisionRow.
function timelineRow(it) {
  const isCommit = it.stream === 'commit'
  return '<div class="row">'
    + '<span class="chip' + (isCommit ? ' sha' : '') + '"'
    + (isCommit ? '' : ' style="color:' + it.color + '"') + '>' + esc(it.mark) + '</span>'
    + '<span class="ellip" style="flex:0 0 122px;color:' + it.color + ';font-size:11px">' + esc(it.label) + '</span>'
    + '<span class="ellip" style="flex:1 1 auto;min-width:0">' + esc(it.text) + '</span>'
    + (it.truncated ? '<span class="chip" style="flex:0 0 auto;color:var(--warn)" title="summary cut at the snapshot cap">truncated</span>' : '')
    + (it.path ? '<span class="ellip" style="flex:0 1 190px;color:var(--dimmer);font-size:11px;text-align:right">' + esc(it.path) + '</span>' : '')
    + '<span style="flex:0 0 42px;text-align:right;color:var(--dimmer);font-size:11px">' + esc(clock(it.date) || it.when) + '</span>'
    + '</div>'
}

// Plain text, always rendered: the window this view stands on and every omission it was
// told about. Truncation is never silent (D41).
function timelineWindowLine() {
  if (!TIMELINE.present) {
    return 'This snapshot carries no timeline key: no recorded events and no window to state. '
      + 'Any rows below are commits from the git window.'
  }
  const w = TIMELINE.window
  const o = TIMELINE.omitted
  const head = w
    ? 'Window: last ' + stated(w.days) + ' days, floor ' + stated(w.floorEvents) + ' events, ceiling '
      + stated(w.ceilingEvents) + ' events, byte budget ' + kbBytes(w.byteBudget) + '.'
    : 'Window: not stated in this snapshot.'
  let tail
  if (!o) {
    tail = 'No omission record in this snapshot, so how much was left out is unknown.'
  } else if (o.count > 0) {
    tail = o.count + ' event' + (o.count === 1 ? '' : 's') + ' omitted, oldest kept '
      + stated(o.oldestKept) + ', limit that bit: ' + reasonText(o.reason) + '.'
  } else {
    tail = 'Nothing omitted: every event inside the window is shown.'
  }
  return head + ' ' + tail
}

function vTimeline() {
  const stream = timelineStream()
  const bar = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 4px">'
    + '<span style="color:var(--dim);font-size:11.5px">' + TIMELINE.events.length + ' recorded event'
    + (TIMELINE.events.length === 1 ? '' : 's') + ' &#183; ' + COMMITS.length + ' commit'
    + (COMMITS.length === 1 ? '' : 's') + '</span>'
    + '<span style="margin-left:auto;color:var(--dim);font-size:11.5px">' + stream.length + ' in the merged stream</span></div>'
  const note = '<div style="padding:0 6px;color:var(--dim);font-size:11.5px;line-height:1.65">'
    + esc(timelineWindowLine()) + '</div>'

  if (!stream.length) {
    return bar + note + '<section class="panel"><div class="empty">'
      + 'No events and no commits in this snapshot. The timeline fills in as intents and runs '
      + 'are recorded under the runs area and as commits land in the window.</div></section>'
  }

  const days = []
  stream.forEach(function (it) {
    const key = dayKey(it.at)
    const last = days[days.length - 1]
    if (last && last.key === key) last.items.push(it)
    else days.push({ key: key, items: [it] })
  })

  return bar + note + days.map(function (day) {
    const blocks = []
    day.items.forEach(function (it) {
      const key = groupKey(it)
      const last = blocks[blocks.length - 1]
      if (last && last.key === key) last.items.push(it)
      else blocks.push({ key: key, label: groupLabel(it), items: [it] })
    })
    return '<section class="panel"><div class="panel-head">'
      + '<span class="eyebrow">' + esc(dayLabel(day.key)) + '</span>'
      + '<span style="margin-left:auto;color:var(--dimmer);font-size:11px">' + day.items.length
      + ' item' + (day.items.length === 1 ? '' : 's') + '</span></div>'
      + '<div style="display:flex;flex-direction:column;gap:10px">'
      + blocks.map(function (b) {
        return '<div><div style="display:flex;align-items:center;gap:9px;padding:0 10px 4px 10px">'
          + '<span style="color:var(--dimmer);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">'
          + esc(b.label) + '</span>'
          + '<span style="margin-left:auto;color:var(--dimmer);font-size:10.5px">' + b.items.length + '</span></div>'
          + '<div style="display:flex;flex-direction:column;gap:2px">' + b.items.map(timelineRow).join('') + '</div></div>'
      }).join('')
      + '</div></section>'
  }).join('')
}

/* == src/views/overview.mjs == */
// Overview: lifecycle (grid or console layout), roadmap brief, knowledge counts,
// recent git, decisions. Sections without a data producer render empty states.





function lifecycleGrid(phases) {
  return '<section class="panel"><div class="panel-head"><span class="eyebrow">lifecycle</span>'
    + '<span style="color:var(--dimmer);font-size:11.5px">' + esc(LASTRUN.id || '') + '</span>'

// Roadmap: overall progress plus one section per milestone with its tasks.



function vRoadmap() {
  const ms = ROADMAP.map(milestoneVm)
  if (!ms.length) return '<section class="panel"><div class="empty">No roadmap data yet. This view fills in when the track phase starts writing milestones into the snapshot.</div></section>'
  const done = ms.filter(function (m) { return m.status === 'done' }).length
  const active = ms.filter(function (m) { return m.status === 'active' }).length
  const overall = Math.round(ms.reduce(function (a, m) { return a + m.pct }, 0) / ms.length)
  const head = '<section class="panel" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">'
    + '<div style="display:flex;flex-direction:column;gap:1px"><span class="eyebrow">overall</span>'
    + '<span class="sans" style="font-size:26px;font-weight:600">' + overall + '%</span></div>'
    + '<div class="bar" style="flex:1 1 240px;height:7px"><span style="height:7px;background:var(--accent);width:' + overall + '%"></span></div>'
    + '<div style="display:flex;gap:8px">'
    + '<span class="chip" style="padding:5px 12px;background:var(--ok-soft);color:var(--ok);font-size:11.5px">' + done + ' done</span>'
    + '<span class="chip" style="padding:5px 12px;background:var(--accent-soft);color:var(--accent);font-size:11.5px">' + active + ' active</span>'
    + '<span class="chip" style="padding:5px 12px;font-size:11.5px">' + (ms.length - done - active) + ' planned</span>'
    + '</div></section>'
  return head + ms.map(function (m) {
    return '<section class="panel"><div class="panel-head">'
      + '<span style="width:8px;height:8px;border-radius:50%;background:' + m.color + '"></span>'
      + '<span class="sans" style="font-size:15px;font-weight:600">' + esc(m.title) + '</span>'
      + '<span style="color:var(--dimmer);font-size:11.5px">' + esc(m.version) + '</span>'
      + '<span class="chip" style="padding:2px 10px;color:' + m.color + ';letter-spacing:.08em;text-transform:uppercase">' + esc(m.status) + '</span>'
      + '<span style="margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--dim);font-size:11.5px">'
      + '<span>' + m.done + '/' + m.total + ' tasks</span>'
      + '<span class="bar" style="width:120px;height:4px;display:inline-block"><span style="height:4px;background:' + m.color + ';width:' + m.pct + '%"></span></span>'
      + '<span style="width:36px;text-align:right;color:var(--text)">' + m.pct + '%</span></span></div>'
      + '<div style="display:flex;flex-direction:column;gap:3px">'
      + m.tasks.map(function (t) {
        const mark = t.status === 'done' ? '✓' : t.status === 'active' ? '▸' : '·'
        const mc = t.status === 'done' ? 'var(--ok)' : t.status === 'active' ? 'var(--accent)' : 'var(--dimmer)'
        return '<div class="tile" style="display:flex;align-items:center;gap:12px;padding:9px 12px">'
          + '<span style="flex:0 0 14px;color:' + mc + ';font-size:12px">' + mark + '</span>'
          + '<span class="chip">' + esc(t.ref || '') + '</span>'
          + '<span style="flex:1 1 auto;min-width:0;color:' + (t.status === 'todo' ? 'var(--dim)' : 'var(--text)') + '">' + esc(t.title || '') + '</span>'
          + '<span style="flex:0 0 auto;color:var(--dimmer);font-size:11px">' + esc(t.owner || '') + '</span></div>'
      }).join('') + '</div></section>'
  }).join('')
}

// Git: full commit window with text filter and conventional-kind segments.




function vGit() {
  const q = S.query.trim().toLowerCase()
  const visible = COMMITS.filter(function (c) {
    return (S.filter === 'all' || c.kind === S.filter)
      && (!q || (c.subject + ' ' + c.sha + ' ' + c.author).toLowerCase().indexOf(q) !== -1)
  })
  const kinds = ['all', 'feat', 'fix', 'docs', 'test', 'chore', 'refactor']
  const bar = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 4px">'
    + '<div class="pill" style="flex:0 0 300px;gap:9px"><span style="color:var(--dimmer)">&#9906;</span>'
    + '<input id="git-q" type="text" placeholder="filter subject, sha, author" value="' + esc(S.query) + '" '
    + 'style="flex:1 1 auto;min-width:0;border:0;outline:none;background:transparent;color:var(--text);font-family:inherit;font-size:12.5px"></div>'
    + '<div class="seg">' + kinds.map(function (k) {
      return '<button data-act="filter" data-v="' + k + '" class="' + (S.filter === k ? 'active' : '') + '">' + k + '</button>'
    }).join('') + '</div>'
    + '<span style="margin-left:auto;color:var(--dim);font-size:11.5px">' + visible.length + ' of ' + COMMITS.length + ' commits</span></div>'

  return bar + '<section class="panel" style="padding:14px 14px 8px 14px">'
    + '<div style="display:flex;gap:12px;padding:0 12px 10px 12px;color:var(--dim);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase">'
    + '<span style="flex:0 0 78px">sha</span><span style="flex:0 0 58px">kind</span><span style="flex:1 1 auto">subject</span>'
    + '<span style="flex:0 0 130px">author</span>' + (hasStat ? '<span style="flex:0 0 84px">files</span>' : '')
    + '<span style="flex:0 0 84px">when</span></div>'
    + '<div style="display:flex;flex-direction:column;gap:2px">'
    + visible.map(function (c) {
      return '<div class="row" style="gap:12px;padding:9px 12px">'
        + '<span style="flex:0 0 78px"><span class="chip sha">' + esc(c.sha) + '</span></span>'
        + '<span style="flex:0 0 58px;color:' + c.kindColor + ';font-size:11px">' + esc(c.kind) + '</span>'
        + '<span class="ellip" style="flex:1 1 auto;min-width:0">' + esc(c.subject) + '</span>'
        + '<span class="ellip" style="flex:0 0 130px;color:var(--dim);font-size:11.5px">' + esc(c.author) + '</span>'
        + (hasStat ? '<span style="flex:0 0 84px;font-size:11px"><span style="color:var(--ok)">+' + (c.add || 0) + '</span> <span style="color:var(--stop)">&#8722;' + (c.del || 0) + '</span></span>' : '')
        + '<span style="flex:0 0 84px;color:var(--dimmer);font-size:11px">' + esc(c.when) + '</span></div>'
    }).join('') + '</div></section>'
}

// Knowledge: bundle tree navigation plus the file viewer with frontmatter chips.




function treeBtn(f, i, indent) {
  const on = S.file === i
  return '<button class="navbtn" data-act="file" data-v="' + i + '" style="border-radius:12px;padding:8px 10px;'
    + (indent ? 'padding-left:28px;' : '') + (on ? 'background:var(--accent-soft);color:var(--accent)' : '') + '">'
    + '<span style="color:var(--dimmer)">' + (indent ? '·' : '≡') + '</span>'
    + '<span class="ellip" style="flex:1 1 auto;min-width:0">' + esc((f.path || '').split('/').pop()) + '</span>'
    + '<span style="color:var(--dimmer);font-size:10.5px">' + esc((f.frontmatter && f.frontmatter.type) || f.type || '') + '</span></button>'
}

function vKnowledge() {
  if (!FILES.length) return '<section class="panel"><div class="empty">The knowledge bundle is empty.</div></section>'
  const af = FILES[S.file] || FILES[0]
  let tree = ''
  FILES.forEach(function (f, i) {
    if ((f.path || '').split('/').pop() !== 'index.md') return
    tree += treeBtn(f, i)
  })
  AREAS.forEach(function (dir) {
    const inDir = FILES.map(function (f, i) { return [f, i] }).filter(function (p) {
      return (p[0].path || '').indexOf(dir + '/') !== -1 && (p[0].path || '').split('/').pop() !== 'index.md'
    })
    if (!inDir.length) return
    tree += '<div style="display:flex;align-items:center;gap:9px;padding:8px 10px;color:var(--dim);font-size:12.5px">'
      + '<span style="color:var(--dimmer)">&#9656;</span><span>' + dir + '/</span>'
      + '<span style="margin-left:auto;color:var(--dimmer);font-size:10.5px">' + inDir.length + '</span></div>'
    inDir.forEach(function (p) { tree += treeBtn(p[0], p[1], true) })
  })
  const fm = af.frontmatter || {}
  const fmRows = Object.keys(fm).map(function (k) {
    const v = fm[k]
    return '<div class="tile" style="display:flex;gap:10px;padding:8px 12px;border-radius:12px">'
      + '<span style="flex:0 0 auto;color:var(--dim);font-size:11.5px">' + esc(k) + '</span>'
      + '<span style="flex:1 1 auto;min-width:0;font-size:12px;word-break:break-word;text-align:right">' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</span></div>'
  }).join('')
  return '<div style="display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:14px;align-items:start">'
    + '<section class="panel" style="padding:14px"><div class="panel-head" style="padding:2px 8px 12px 8px">'
    + '<span class="eyebrow">' + esc(ROOT) + '</span>'
    + '<span class="chip" style="margin-left:auto">okf 0.2</span></div>'
    + '<div style="display:flex;flex-direction:column;gap:2px">' + tree + '</div></section>'
    + '<section class="panel" style="min-width:0"><div class="panel-head">'
    + '<span class="sans ellip" style="font-size:14.5px;font-weight:600;min-width:0">' + esc(af.path || '') + '</span>'
    + (fm.type || af.type ? '<span class="chip" style="background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)">' + esc(fm.type || af.type) + '</span>' : '')
    + '<span style="margin-left:auto;color:var(--dimmer);font-size:11px;white-space:nowrap">' + esc(af.size || '') + (af.updated ? ' &#183; ' + rel(af.updated) : '') + '</span></div>'
    + (fmRows ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;padding-bottom:14px">' + fmRows + '</div>' : '')
    + (af.body != null
      ? '<pre class="body">' + esc(af.body) + (af.truncated ? '\n\n[truncated at the snapshot window cap]' : '') + '</pre>'
      : '<div class="empty">Body not embedded in the snapshot (over the window cap or metadata-only).</div>')
    + '</section></div>'
}

/* == src/views/config.mjs == */
// Config: sectioned key/value tables or the raw JSON, straight from the island.




function fmtV(v) {
  if (Array.isArray(v)) return v.length === 0 ? '[ ]' : v.map(function (x) { return typeof x === 'object' && x !== null ? Object.values(x).join(' / ') : String(x) }).join(', ')
  if (typeof v === 'object' && v !== null) return Object.keys(v).map(function (k) { return k + ': ' + fmtV(v[k]) }).join(' · ')
  return v === '' ? '(empty)' : String(v)
}

function vConfig() {
  const bar = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px">'
    + '<div class="seg">'
    + '<button data-act="cfgmode" data-v="table" class="' + (S.configMode === 'table' ? 'active' : '') + '">table</button>'
    + '<button data-act="cfgmode" data-v="raw" class="' + (S.configMode === 'raw' ? 'active' : '') + '">raw json</button></div>'
    + '<span style="color:var(--dim);font-size:11.5px">.claude/major-tom.json &#183; schemaVersion ' + esc(CFG.schemaVersion != null ? CFG.schemaVersion : '?') + '</span>'
    + '<span class="chip" style="margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--ok-soft);color:var(--ok);font-size:11.5px"><span class="dot"></span>validated at onboard</span></div>'
  if (S.configMode === 'raw') {
    return bar + '<section class="panel"><div class="panel-head"><span class="eyebrow">raw</span></div>'
      + '<pre class="body" style="white-space:pre;overflow:auto">' + esc(JSON.stringify(CFG, null, 2)) + '</pre></section>'
  }
  const sections = Object.keys(CFG).map(function (key) {
    const v = CFG[key]
    let rows
    if (Array.isArray(v)) rows = v.length ? v.map(function (x, i) { return { k: '[' + i + ']', v: fmtV(x) } }) : [{ k: '[ ]', v: '(empty)' }]
    else if (typeof v === 'object' && v !== null) rows = Object.keys(v).map(function (k) { return { k: k, v: fmtV(v[k]) } })
    else rows = [{ k: key, v: fmtV(v) }]
    return '<section class="panel"><div class="panel-head">'
      + '<span class="sans" style="font-size:14px;font-weight:600">' + esc(key) + '</span></div>'
      + '<div style="display:flex;flex-direction:column;gap:2px">'
      + rows.map(function (r) {
        return '<div class="tile" style="display:flex;gap:12px;padding:8px 12px;border-radius:12px">'
          + '<span style="flex:0 0 160px;color:var(--dim);font-size:11.5px;word-break:break-word">' + esc(r.k) + '</span>'
          + '<span style="flex:1 1 auto;min-width:0;color:' + (r.v === '(empty)' ? 'var(--dimmer)' : 'var(--text)') + ';word-break:break-word">' + esc(r.v) + '</span></div>'
      }).join('') + '</div></section>'
  }).join('')
  return bar + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-items:start">' + sections + '</div>'
}

    }).join('')
    + '<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">'
    + '<button class="navbtn" data-act="theme" title="Theme"><span style="flex:0 0 22px;text-align:center">' + (S.theme === 'light' ? '◑' : '◐') + '</span><span class="rail-label">' + S.theme + '</span></button>'
    + '<button class="navbtn" data-act="rail" title="Collapse"><span style="flex:0 0 22px;text-align:center">' + (S.rail ? '«' : '»') + '</span><span class="rail-label">collapse</span></button>'
    + '</div>'
}

function renderMain() {
  const p = CFG.project || {}
  const ex = CFG.execution || {}
  const teamPill = ex.workingModel === 'team' && ex.team
    ? 'team &#183; ' + ((ex.team.members || []).length) + ' + coordinator'
    : esc(ex.workingModel || '')
  document.getElementById('main').innerHTML =
    '<header class="top"><div style="display:flex;flex-direction:column;gap:2px;min-width:0">'
    + '<h1 class="sans">' + esc(S.view) + '</h1>'
    + '<span style="color:var(--dim);font-size:12px">' + esc(SUBTITLES[S.view]) + '</span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap">'
    + '<span class="pill"><span class="dot pulse"></span>snapshot ' + esc(DATA.generatedAt || 'n/a') + '</span>'
    + (p.name ? '<span class="pill">' + esc(p.name) + (p.topology ? ' &#183; ' + esc(p.topology) : '') + '</span>' : '')
    + (teamPill ? '<span class="pill accent">' + teamPill + '</span>' : '')
    + '</div></header>' + VIEW_FN[S.view]()
  const q = document.getElementById('git-q')
  if (q) {
    q.addEventListener('input', function (e) {
      S.query = e.target.value
      renderMain()
      const q2 = document.getElementById('git-q')
      q2.focus()
      q2.setSelectionRange(q2.value.length, q2.value.length)
    })
  }
}

function render() {
  document.getElementById('app').classList.toggle('collapsed', !S.rail)
  renderRail()
  renderMain()
}

document.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const act = btn.getAttribute('data-act')
  const v = btn.getAttribute('data-v')
  if (act === 'view') { S.view = v; history.replaceState(null, '', '#/' + v); render() }
  else if (act === 'layout') { S.layout = v; renderMain() }
  else if (act === 'filter') { S.filter = v; renderMain() }
  else if (act === 'file') { S.file = Number(v); renderMain() }
  else if (act === 'cfgmode') { S.configMode = v; renderMain() }
  else if (act === 'theme') {
    S.theme = S.theme === 'light' ? 'dark' : 'light'
    localStorage.setItem('mt-theme', S.theme)
    document.documentElement.dataset.theme = S.theme
    render()
  } else if (act === 'rail') {
    S.rail = !S.rail
    localStorage.setItem('mt-rail', S.rail ? '1' : '0')
    render()
  }
})

window.addEventListener('hashchange', function () {
  const h = (location.hash || '').replace(/^#\/?/, '')
  if (VIEWS.indexOf(h) !== -1) { S.view = h; render() }
})

document.documentElement.dataset.theme = S.theme
document.title = 'Major Tom: ' + ((CFG.project || {}).name || 'dashboard')
render()
})()
</script>
</body>
</html>
