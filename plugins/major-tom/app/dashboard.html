<script>
(function () {
'use strict'

/* == src/api.mjs == */
// Transport, and nothing else (D43 point 7). This module talks to the server the page was
// served from and hands back a plain result object; no derivation, no state and no DOM live

//
// The two routes are the whole client-facing contract of the server:
//
//   GET /api/snapshot                the snapshot for the served repository
//   GET /api/knowledge/body?id=<id>  the body of the one concept that id addresses
//
// Both are same origin and both are read-only, so no base URL is configurable here: a
// configurable origin would be a way to point this page at a server it was not served by,
// which is surface nobody asked for.
//
// Failure is a value, never an exception. Every path below resolves, never rejects, with
// `{ ok: false, route, status, error }`, and the error string is the one the server sent
// whenever it sent one (the server answers a refused input with `{ error: "<message>" }`,
// which is the message the user actually needs). This matters more here than it usually
// would: D43 point 2 dropped the degraded path, so a failed fetch has no embedded data to
// fall back on and the message is the only thing the page can show.

const SNAPSHOT_ROUTE = '/api/snapshot'
const BODY_ROUTE = '/api/knowledge/body'

function describe(e) {
  return e && e.message ? String(e.message) : String(e)
}

// The first line of a non-JSON error body, clipped. Our server never takes this path: it
// answers every failure, the 404s and the 405 included, as JSON `{error}`, so the branch above
// reads the served message instead. This exists for a body that is not JSON at all, which
// means something other than our server produced it (a proxy, a captive portal, a stray HTML
// error page). Such a body is worth one clipped line as a clue and no more, hence the clip.
function firstLine(text) {
  const line = String(text == null ? '' : text).split('\n')[0].trim()
  return line.length > 200 ? line.slice(0, 200) + '...' : line
}

// One request, one result object. Reads the body as text first and parses it here rather than
// calling res.json(), because the error path needs the raw text when the body is not JSON and
// res.json() would have consumed the stream by then.
function requestJson(route) {
  let status = 0
  return fetch(route, { method: 'GET', cache: 'no-store', headers: { Accept: 'application/json' } })
    .then(function (res) {
      status = res.status
      return res.text().then(function (text) {
        return { ok: res.ok, text: text }
      })
    })
    .then(function (res) {
      let parsed = false
      let payload = null
      let parseError = ''
      try {
        payload = JSON.parse(res.text)
        parsed = true
      } catch (e) {
        parseError = describe(e)
      }
      const served = parsed && payload !== null && typeof payload === 'object'
        && typeof payload.error === 'string' && payload.error !== '' ? payload.error : ''
      if (!res.ok) {
        const body = firstLine(res.text)
        return {
          ok: false, route: route, status: status,
          error: served || (body
            ? 'the server answered HTTP ' + status + ': ' + body
            : 'the server answered HTTP ' + status + ' with an empty body')
        }
      }
      if (!parsed) {
        return {
          ok: false, route: route, status: status,
          error: 'the server answered HTTP ' + status + ' with a body that is not JSON (' + parseError + ')'
        }
      }
      return { ok: true, route: route, status: status, data: payload }
    })
    .catch(function (e) {
      // No response at all: the server is not running, was stopped mid-session, or the
      // connection failed. Naming the origin matters, because the usual cause is that the
      // process behind it is gone and the user is the one who has to start it again.
      return {
        ok: false, route: route, status: status,
        error: 'the request to ' + route + ' did not complete (' + describe(e) + ')'
      }
    })
}

// The whole snapshot. Recomputed by the server on every call, so this is equally the load
// request and the refresh request: D43 point 5's explicit recompute is this same request
// issued again, and there is no separate verb to call.
function fetchSnapshot() {
  return requestJson(SNAPSHOT_ROUTE)
}

// The body of one concept, addressed by the opaque id its listing entry carries. The id is
// minted by the server and never built here, so the client holds no knowledge path at all.
function fetchKnowledgeBody(id) {
  return requestJson(BODY_ROUTE + '?id=' + encodeURIComponent(String(id == null ? '' : id)))
}

/* == src/data.mjs == */
// Snapshot derivations. The input is the JSON the server computed and api.mjs fetched
// (D43 point 7); the data island this module used to parse is gone with `render.js inject`.
//
// What changed and what did not. Every derivation below is the one that was here before, with
// the same defensive reading: a missing key, a malformed key and a wrong type are all tolerated
// at every level, because a snapshot from an older producer must degrade into an honest empty
// view instead of a broken page. What changed is only when they run. They used to be top-level
// constants evaluated at module load, which an asynchronous fetch makes impossible, so the
// module now holds one stored derivation and exposes accessors over it.
//
// Derived once per stored snapshot, not once per accessor call: setData does the work and the
// accessors are lookups. That keeps the cost and the internal consistency of a single load
// exactly where they were, and it keeps the relative times (`rel`) fixed between refreshes
// rather than drifting under a view that is re-rendered on every keystroke.
//
// Before the first load, and after a failed one, the store holds the derivation of an empty
// snapshot: the chrome renders honest zeros while state.mjs carries what is actually going on.

// The five canonical areas of section 11, in the order that section declares them. They are a
// convention, not a schema: OQ-7 leaves the bundle's internal layout open. So this list is used
// to order the groups the bundle actually holds and to keep the overview's five tiles present
// even at zero; it never decides which groups exist. See deriveGroups.
const AREAS = ['memories', 'docs', 'runs', 'monitors', 'logs']

// The label of the group holding the concepts that sit at the bundle root, with no directory
// above them. It starts with a slash on purpose: a path segment can never contain one, so this
// label cannot collide with the label of a real directory however that directory is named,
// including a directory literally called "(bundle root)".
const ROOT_GROUP_LABEL = '/ (bundle root)'

const KIND_COLOR = { feat: 'var(--accent)', fix: 'var(--stop)', docs: 'var(--dim)', test: 'var(--ok)', chore: 'var(--dimmer)', refactor: 'var(--warn)' }
const TIER_COLOR = { trivial: 'var(--dimmer)', task: 'var(--warn)', substantive: 'var(--accent)' }

function rel(iso) {
  if (!iso) return ''
  const t = Date.parse(iso)
  if (isNaN(t)) return String(iso)
  const m = Math.round((Date.now() - t) / 60000)
  if (m < 1) return 'now'
  if (m < 60) return m + ' min ago'
  if (m < 1440) return Math.round(m / 60) + ' h ago'
  return Math.round(m / 1440) + ' d ago'
}

function clock(iso) {
  const t = Date.parse(iso)
  if (isNaN(t)) return ''
  const d = new Date(t)
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
}

function deriveCommits(raw) {
  return (Array.isArray(raw.git) ? raw.git : []).map(function (c) {
    const kind = c.kind || (String(c.subject || '').match(/^(feat|fix|docs|test|chore|refactor)/) || [])[1] || 'other'
    return {
      sha: String(c.hash || '').slice(0, 7), kind: kind, kindColor: KIND_COLOR[kind] || 'var(--dim)',
      subject: c.subject || '', author: c.author || '', add: c.add, del: c.del,
      when: rel(c.date), date: c.date || ''
    }
  })
}

// One entry per concept. Bodies no longer travel here (D43 point 4): each entry carries the
// opaque `id` the server minted for it, and views.knowledge fetches one body at a time through
// api.mjs. A string entry is still accepted, which is what a producer older than schema v2
// wrote, and such an entry simply has no id to fetch with.
function deriveFiles(raw) {
  return ((raw.knowledge || {}).files || []).map(function (f) {
    return typeof f === 'string' ? { path: f } : f
  })
}

// The one grouping of the knowledge listing, read by the tree (views/knowledge.mjs) and by the
// overview's per-area counts alike. Every entry of knowledge.files[] lands in exactly one group,
// keyed by the first segment of its path.
//
// Why the first segment rather than the five canonical areas. Section 11 declares memories,
// docs, runs, monitors and logs as the convention, but OQ-7 leaves the bundle's internal layout
// open, so the bundle may legitimately hold a concept the convention does not predict: in a
// directory nobody declared, or at the bundle root itself. Grouping against a fixed list drops
// such a file out of the tree entirely while still counting it in the rail, which is how a file
// became invisible and, once bodies are fetched for the selected file only, unreachable. A view
// that silently drops a file it was given is worse than one that shows an unexpected group. The
// five areas still appear whenever they hold something, because they emerge from the data like
// any other group.
//
// The grouping is a partition, which is what makes the counts add up and what guarantees the
// tree renders exactly one button per file: a nested path contributes to its first segment only,
// so memories/docs/x.md is one entry under memories and not one under each.
//
// Each entry keeps the index it has in files(), because that index is what a tree button carries
// and what selects the file. Grouping reorders the presentation and never the array.
//
// Group order: the canonical areas first, in the order section 11 declares them, then every
// other directory in code-unit order, then the bundle root last. The convention leads because it
// is what a reader expects to find; anything outside it collects below, where it reads as the
// exception it is; the root group is the least ordinary of all, so it closes the list. Code-unit
// order rather than localeCompare, so the same bundle renders identically under every locale.
// Files inside a group keep the snapshot's own order, which the producer already fixed.
function deriveGroups(fileList) {
  const byDir = new Map()
  const rootEntries = []
  fileList.forEach(function (f, i) {
    const parts = String(f.path == null ? '' : f.path).split('/')
    // A single segment is a file at the bundle root. So is a path with an empty first segment
    // (a leading slash) and so is a missing path: neither names a directory to group under.
    if (parts.length < 2 || parts[0] === '') {
      rootEntries.push({ file: f, index: i })
      return
    }
    if (!byDir.has(parts[0])) byDir.set(parts[0], [])
    byDir.get(parts[0]).push({ file: f, index: i })
  })
  const others = []
  byDir.forEach(function (entries, dir) { if (AREAS.indexOf(dir) === -1) others.push(dir) })
  others.sort(function (a, b) { return a < b ? -1 : a > b ? 1 : 0 })
  const out = AREAS.filter(function (a) { return byDir.has(a) })
    .concat(others)
    .map(function (dir) { return { dir: dir, label: dir, entries: byDir.get(dir) } })
  if (rootEntries.length) out.push({ dir: null, label: ROOT_GROUP_LABEL, entries: rootEntries })
  return out
}

// The overview's knowledge tiles: one per canonical area, one per group outside the convention,
// and the total last. Built from the same partition as the tree, so the area tiles now sum to
// the total instead of quietly omitting whatever lives outside the five areas.
//
// What this changes and what it does not. The five canonical tiles are still always rendered,
// at zero when the area is empty, because the convention is what they state. What they count
// changes in one case: an area name is now matched as the first path segment only, so
// memories/docs/x.md counts under memories alone where it used to count under both memories and
// docs. Double counting is precisely what stopped the tiles from adding up.
function deriveCounts(fileList, groupList) {
  const byDir = new Map()
  groupList.forEach(function (g) { if (g.dir !== null) byDir.set(g.dir, g.entries.length) })
  const out = AREAS.map(function (a) { return { label: a, n: byDir.get(a) || 0 } })
  groupList.forEach(function (g) {
    if (g.dir === null || AREAS.indexOf(g.dir) === -1) out.push({ label: g.label, n: g.entries.length })
  })
  out.push({ label: 'concepts', n: fileList.length })
  return out
}

function deriveDecisions(raw, fileList) {
  return Array.isArray(raw.decisions) ? raw.decisions : fileList
    .filter(function (f) { return f.frontmatter && f.frontmatter.type === 'decision' })
    .map(function (f) {
      return {
        id: f.frontmatter.id || f.path, text: f.frontmatter.title || f.path,
        // date precedence mirrors buildDecisions in plugins/major-tom/app/snapshot.js:
        // the declared frontmatter date, the file mtime otherwise. The two derivations of
        // this one field are deliberately coupled, so keep them in step.
        date: f.frontmatter.date || f.updated || '', status: f.frontmatter.status === 'open' ? 'open' : 'closed'
      }
    })

// The timeline key (D41). Optional: a snapshot from a producer older than it lacks the key
// entirely, so a missing or malformed key degrades to an empty view that states what it does
// not have. Commits are deliberately not part of it; the view merges the git key in client side.
//
// `window` no longer carries `byteBudget` and `omitted.reason` can no longer be "bytes"
// (D43 point 4 dropped the 256 KB timeline budget along with the knowledge caps). The days
// horizon, the floor and the ceiling survive untouched, as a legibility choice rather than a
// weight one. A snapshot old enough to still carry a byteBudget simply has a member nothing
// reads; the view states the window it is given and nothing else.
function deriveTimeline(raw) {
  const t = raw.timeline && typeof raw.timeline === 'object' && !Array.isArray(raw.timeline) ? raw.timeline : null
  const source = t && Array.isArray(t.events) ? t.events : []
  const events = source.filter(function (e) { return e && typeof e === 'object' }).map(function (e) {
    const isRun = e.kind === 'run'
    const tier = isRun || e.tier == null ? null : String(e.tier)
    const sid = e.sessionId == null ? '' : String(e.sessionId)
    const ms = Date.parse(e.at)
    return {
      stream: 'event', kind: isRun ? 'run' : 'intent', tier: tier,
      type: isRun || e.type == null ? null : String(e.type),
      color: isRun ? 'var(--ok)' : (TIER_COLOR[tier] || 'var(--dim)'),
      text: e.summary == null ? '' : String(e.summary),
      truncated: e.summaryTruncated === true,
      promptId: e.promptId == null ? '' : String(e.promptId),
      sessionId: sid, session: sid ? sid.slice(0, 8) : '',
      path: e.path == null ? '' : String(e.path),
      date: e.at || '', when: rel(e.at), at: isNaN(ms) ? null : ms
    }
  })
  const w = t && t.window && typeof t.window === 'object' ? t.window : null
  const o = t && t.omitted && typeof t.omitted === 'object' ? t.omitted : null
  return {
    present: !!t, events: events,
    window: w ? { days: w.days, floorEvents: w.floorEvents, ceilingEvents: w.ceilingEvents } : null,
    omitted: o ? { count: Number(o.count) || 0, oldestKept: o.oldestKept || '', reason: o.reason == null ? null : String(o.reason) } : null
  }
}

//
// The top-level guard is the single tolerance this rewrite adds, and it is added because the
// input genuinely changed: the island could only ever hold what the renderer put there, while
// a response body is whatever arrived, including `null` or an array. Everything below it reads
// exactly as defensively as it did before.
function derive(raw) {
  const data = raw !== null && typeof raw === 'object' && !Array.isArray(raw) ? raw : {}
  const config = data.config || {}
  const fileList = deriveFiles(data)
  const groupList = deriveGroups(fileList)
  return {
    data: data,
    cfg: config,
    root: (config.persistence && config.persistence.root) || '.knowledge',
    commits: deriveCommits(data),
    files: fileList,
    groups: groupList,
    counts: deriveCounts(fileList, groupList),
    decisions: deriveDecisions(data, fileList),
    timeline: deriveTimeline(data),
    roadmap: data.roadmap && Array.isArray(data.roadmap.milestones) ? data.roadmap.milestones : [],
    lastRun: data.lastRun || null
  }
}

let CURRENT = derive({})

// Stores one fetched snapshot and derives it. Called by the boot and by every refresh, and by
// nothing else. It throws only if a derivation throws on a genuinely malformed payload, which
// the caller turns into the error state rather than a blank page.
function setData(raw) {
  CURRENT = derive(raw)
}

function generatedAt() { return CURRENT.data.generatedAt || '' }
function cfg() { return CURRENT.cfg }
function root() { return CURRENT.root }
function commits() { return CURRENT.commits }
function files() { return CURRENT.files }
function groups() { return CURRENT.groups }
function counts() { return CURRENT.counts }
function decisions() { return CURRENT.decisions }
function timeline() { return CURRENT.timeline }
function roadmap() { return CURRENT.roadmap }
function lastRun() { return CURRENT.lastRun }

/* == src/state.mjs == */
// Mutable UI state, the load lifecycle, and the view registry metadata.


const VIEWS = ['overview', 'roadmap', 'timeline', 'git', 'knowledge', 'config']

// A function rather than a constant, because two of these count things that only exist once a
// snapshot has been fetched (D43 point 7). Called on every header render, so it always states
// the data actually on screen and not the data that was there when the page loaded.
function subtitles() {
  return {
    overview: 'Lifecycle state, roadmap and knowledge at a glance',
    roadmap: 'Milestones, tasks and open questions',
    timeline: timeline().events.length + '-event window merged with the commit stream',

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  })
}

function statusColor(st) {
  return st === 'done' ? 'var(--ok)' : st === 'active' ? 'var(--accent)' : 'var(--line2)'
}

function commitRow(c) {
  return '<div class="row">'
    + '<span class="chip sha">' + esc(c.sha) + '</span>'
    + '<span style="flex:0 0 58px;color:' + c.kindColor + ';font-size:11px">' + esc(c.kind) + '</span>'
    + '<span class="ellip" style="flex:1 1 auto;min-width:0">' + esc(c.subject) + '</span>'
    + '<span style="flex:0 0 auto;color:var(--dimmer);font-size:11px">' + esc(c.when) + '</span>'
    + '</div>'
}

function milestoneVm(m) {
  const tasks = Array.isArray(m.tasks) ? m.tasks : []
  const done = tasks.filter(function (t) { return t.status === 'done' }).length
  return {
    title: m.title || '', version: m.version || '', status: m.status || 'planned',
    pct: m.pct != null ? m.pct : (tasks.length ? Math.round(done / tasks.length * 100) : 0),
    color: statusColor(m.status), done: done, total: tasks.length, tasks: tasks
  }
}

function decisionRow(d) {

  return '<div class="row">'
    + '<span class="chip" style="' + (open ? 'border:1px solid var(--line2);color:var(--warn)' : 'background:var(--ok-soft);color:var(--ok)') + '">' + esc(d.id) + '</span>'

function phaseVms() {
  const run = lastRun()
  if (!run || !Array.isArray(run.phases)) return null
  return run.phases.map(function (p, i) {

    return {

/* == src/views/timeline.mjs == */
// Timeline: the recorded intent and run stream (snapshot key `timeline`, D41) merged
// client side with the commit stream, newest first, grouped by day and then by session.
// Commits are never duplicated into the key; the merge happens here.



// The two limits that can bite, and the only two the server can now report: D43 point 4
// dropped the 256 KB timeline budget, so "bytes" left the set of reasons along with it. An
// unrecognised reason still prints verbatim rather than being swallowed, which is how a
// snapshot from an older producer still states honestly why it dropped events.
const REASON_TEXT = {
  days: 'days (the day horizon)',
  ceiling: 'ceiling (the event ceiling)'
}

function stated(v) {
  return v == null || v === '' ? 'not stated' : String(v)
}

function reasonText(r) {
  if (r == null || r === '') return 'not stated'
  return REASON_TEXT[r] || String(r)
}

function dayKey(ms) {
  if (ms == null) return ''
  const d = new Date(ms)
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
}

function dayLabel(key) {
  if (!key) return 'undated'
  const today = new Date()
  const yesterday = new Date()
  yesterday.setDate(yesterday.getDate() - 1)
  if (key === dayKey(today.getTime())) return 'today'
  if (key === dayKey(yesterday.getTime())) return 'yesterday'
  return key
}

function groupKey(it) {
  return it.stream === 'commit' ? 'commit' : 'session:' + it.session
}

function groupLabel(it) {
  if (it.stream === 'commit') return 'git'
  return it.session ? 'session ' + it.session : 'no session id'
}

// The merged stream: timeline events plus commits, one chronological order, newest first.
// Items with an unparseable date keep their place at the end rather than being dropped.
function timelineStream() {
  const commitItems = commits().map(function (c) {
    const ms = Date.parse(c.date)
    return {
      stream: 'commit', kind: 'commit', mark: c.sha, label: c.kind, color: c.kindColor,
      text: c.subject, truncated: false, session: '', path: '',
      date: c.date, when: c.when, at: isNaN(ms) ? null : ms
    }
  })
  const events = timeline().events.map(function (e) {
    return {
      stream: 'event', kind: e.kind, mark: e.kind === 'run' ? 'run' : 'intent',
      label: e.kind === 'run' ? '' : (e.tier || 'intent') + (e.type ? ' ' + e.type : ''),
      color: e.color, text: e.text, truncated: e.truncated, session: e.session, path: e.path,
      date: e.date, when: e.when, at: e.at
    }
  })
  return events.concat(commitItems).sort(function (a, b) {
    if (a.at == null && b.at == null) return 0
    if (a.at == null) return 1
    if (b.at == null) return -1
    return b.at - a.at
  })
}

// One row of the merged stream, at the density of commitRow and decisionRow.
function timelineRow(it) {
  const isCommit = it.stream === 'commit'
  return '<div class="row">'
    + '<span class="chip' + (isCommit ? ' sha' : '') + '"'
    + (isCommit ? '' : ' style="color:' + it.color + '"') + '>' + esc(it.mark) + '</span>'
    + '<span class="ellip" style="flex:0 0 122px;color:' + it.color + ';font-size:11px">' + esc(it.label) + '</span>'
    + '<span class="ellip" style="flex:1 1 auto;min-width:0">' + esc(it.text) + '</span>'
    + (it.truncated ? '<span class="chip" style="flex:0 0 auto;color:var(--warn)" title="summary cut at the 200-character cap">truncated</span>' : '')
    + (it.path ? '<span class="ellip" style="flex:0 1 190px;color:var(--dimmer);font-size:11px;text-align:right">' + esc(it.path) + '</span>' : '')
    + '<span style="flex:0 0 42px;text-align:right;color:var(--dimmer);font-size:11px">' + esc(clock(it.date) || it.when) + '</span>'
    + '</div>'
}

// Plain text, always rendered: the window this view stands on and every omission it was
// told about. Truncation is never silent (D41).
function timelineWindowLine() {
  const t = timeline()
  if (!t.present) {
    return 'This snapshot carries no timeline key: no recorded events and no window to state. '
      + 'Any rows below are commits from the git window.'
  }
  const w = t.window
  const o = t.omitted
  const head = w
    ? 'Window: last ' + stated(w.days) + ' days, floor ' + stated(w.floorEvents) + ' events, ceiling '
      + stated(w.ceilingEvents) + ' events.'
    : 'Window: not stated in this snapshot.'
  let tail
  if (!o) {
    tail = 'No omission record in this snapshot, so how much was left out is unknown.'
  } else if (o.count > 0) {
    tail = o.count + ' event' + (o.count === 1 ? '' : 's') + ' omitted, oldest kept '
      + stated(o.oldestKept) + ', limit that bit: ' + reasonText(o.reason) + '.'
  } else {
    tail = 'Nothing omitted: every event inside the window is shown.'
  }
  return head + ' ' + tail
}

function vTimeline() {
  const stream = timelineStream()
  const eventCount = timeline().events.length
  const commitCount = commits().length
  const bar = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 4px">'
    + '<span style="color:var(--dim);font-size:11.5px">' + eventCount + ' recorded event'
    + (eventCount === 1 ? '' : 's') + ' &#183; ' + commitCount + ' commit'
    + (commitCount === 1 ? '' : 's') + '</span>'
    + '<span style="margin-left:auto;color:var(--dim);font-size:11.5px">' + stream.length + ' in the merged stream</span></div>'
  const note = '<div style="padding:0 6px;color:var(--dim);font-size:11.5px;line-height:1.65">'
    + esc(timelineWindowLine()) + '</div>'

  if (!stream.length) {
    return bar + note + '<section class="panel"><div class="empty">'
      + 'No events and no commits in this snapshot. The timeline fills in as intents and runs '
      + 'are recorded under the runs area and as commits land in the window.</div></section>'
  }

  const days = []
  stream.forEach(function (it) {
    const key = dayKey(it.at)
    const last = days[days.length - 1]
    if (last && last.key === key) last.items.push(it)
    else days.push({ key: key, items: [it] })
  })

  return bar + note + days.map(function (day) {
    const blocks = []
    day.items.forEach(function (it) {
      const key = groupKey(it)
      const last = blocks[blocks.length - 1]
      if (last && last.key === key) last.items.push(it)
      else blocks.push({ key: key, label: groupLabel(it), items: [it] })
    })
    return '<section class="panel"><div class="panel-head">'
      + '<span class="eyebrow">' + esc(dayLabel(day.key)) + '</span>'
      + '<span style="margin-left:auto;color:var(--dimmer);font-size:11px">' + day.items.length
      + ' item' + (day.items.length === 1 ? '' : 's') + '</span></div>'
      + '<div style="display:flex;flex-direction:column;gap:10px">'
      + blocks.map(function (b) {
        return '<div><div style="display:flex;align-items:center;gap:9px;padding:0 10px 4px 10px">'
          + '<span style="color:var(--dimmer);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">'
          + esc(b.label) + '</span>'
          + '<span style="margin-left:auto;color:var(--dimmer);font-size:10.5px">' + b.items.length + '</span></div>'
          + '<div style="display:flex;flex-direction:column;gap:2px">' + b.items.map(timelineRow).join('') + '</div></div>'
      }).join('')
      + '</div></section>'
  }).join('')
}

          + '<span style="flex:0 0 14px;color:' + mc + ';font-size:12px">' + mark + '</span>'

      }).join('') + '</div></section>'
  }).join('')
}

/* == src/views/knowledge.mjs == */
// Knowledge: bundle tree navigation plus the file viewer with frontmatter chips.
//
// Bodies no longer travel in the listing (D43 point 4): each entry carries an opaque id and its
// body is fetched from the server one file at a time. This view stays a pure string builder and
// never fetches; main.mjs issues the request for whatever file is selected and parks the result
// in S, so the four states below are just a read of that state.




function treeBtn(f, i) {
  const on = S.file === i
  return '<button class="navbtn" data-act="file" data-v="' + i + '" style="border-radius:12px;padding:8px 10px;padding-left:28px;'
    + (on ? 'background:var(--accent-soft);color:var(--accent)' : '') + '">'
    + '<span style="color:var(--dimmer)">·</span>'
    + '<span class="ellip" style="flex:1 1 auto;min-width:0">' + esc((f.path || '').split('/').pop()) + '</span>'
    + '<span style="color:var(--dimmer);font-size:10.5px">' + esc((f.frontmatter && f.frontmatter.type) || f.type || '') + '</span></button>'
}

// The body pane, in the four states a fetched body can be in. The empty state this replaces
// said the body was "not embedded in the snapshot (over the window cap or metadata-only)",
// which described a 32 KB per-file cap that D43 point 4 removed; there is no cap left to blame
// and no reason left for a body to be missing other than a request that has not landed, has
// failed, or an entry that carries no id to ask with.
function bodyPane(af) {
  if (S.bodyStatus === 'noid') {
    return '<div class="empty">This entry carries no id, so its body cannot be fetched. '
      + 'Ids are minted by the server; an entry without one came from a producer older than the body endpoint.</div>'
  }
  if (S.bodyStatus === 'loading') {
    return '<div class="empty">Loading the body of ' + esc(af.path || 'this file') + '.</div>'
  }
  if (S.bodyStatus === 'failed') {
    return '<section class="panel" style="background:var(--tile);box-shadow:none">'
      + '<div class="panel-head"><span class="eyebrow">body unavailable</span>'
      + '<button class="btn" data-act="bodyretry" style="margin-left:auto">retry</button></div>'
      + '<div style="color:var(--dim);font-size:12px;line-height:1.7;word-break:break-word">'
      + esc(S.bodyError || 'the request failed and the server said nothing about why') + '</div></section>'
  }
  if (S.bodyStatus === 'ready') {
    if (S.bodyText === '') return '<div class="empty">This file has no body: frontmatter only.</div>'
    return '<pre class="body">' + esc(S.bodyText) + '</pre>'
  }
  return '<div class="empty">No body requested for this file yet.</div>'
}

function vKnowledge() {
  const list = files()
  if (!list.length) return '<section class="panel"><div class="empty">The knowledge bundle is empty.</div></section>'
  const af = list[S.file] || list[0]
  // One button per entry of knowledge.files[], and never more or fewer: the groups are the
  // partition data.mjs derives, so the tree and the rail's count state the same number by
  // construction. Group headings and their order are explained at deriveGroups; a heading is
  // escaped because a directory name is data from the served bundle, not a literal from here.
  //
  // Gone with the fixed area list: the branch that rendered an entry whose basename is index.md
  // unindented at the top of the tree. index.md is the bundle index, not a concept, and the
  // server's concept walk skips it at every depth, so no listing the server produces can contain
  // one; the page is served by that server and always reflects it, so no older artifact can
  // reach this code either. Keeping the branch would also break the invariant above, since an
  // entry it matched would get that button plus its group's button.
  let tree = ''
  groups().forEach(function (g) {
    tree += '<div style="display:flex;align-items:center;gap:9px;padding:8px 10px;color:var(--dim);font-size:12.5px">'
      + '<span style="color:var(--dimmer)">&#9656;</span><span>' + esc(g.label) + (g.dir === null ? '' : '/') + '</span>'
      + '<span style="margin-left:auto;color:var(--dimmer);font-size:10.5px">' + g.entries.length + '</span></div>'
    g.entries.forEach(function (e) { tree += treeBtn(e.file, e.index) })
  })
  const fm = af.frontmatter || {}
  const fmRows = Object.keys(fm).map(function (k) {
    const v = fm[k]
    return '<div class="tile" style="display:flex;gap:10px;padding:8px 12px;border-radius:12px">'
      + '<span style="flex:0 0 auto;color:var(--dim);font-size:11.5px">' + esc(k) + '</span>'
      + '<span style="flex:1 1 auto;min-width:0;font-size:12px;word-break:break-word;text-align:right">' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</span></div>'
  }).join('')
  return '<div style="display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:14px;align-items:start">'
    + '<section class="panel" style="padding:14px"><div class="panel-head" style="padding:2px 8px 12px 8px">'
    + '<span class="eyebrow">' + esc(root()) + '</span>'
    + '<span class="chip" style="margin-left:auto">okf 0.2</span></div>'
    + '<div style="display:flex;flex-direction:column;gap:2px">' + tree + '</div></section>'
    + '<section class="panel" style="min-width:0"><div class="panel-head">'
    + '<span class="sans ellip" style="font-size:14.5px;font-weight:600;min-width:0">' + esc(af.path || '') + '</span>'
    + (fm.type || af.type ? '<span class="chip" style="background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)">' + esc(fm.type || af.type) + '</span>' : '')
    + '<span style="margin-left:auto;color:var(--dimmer);font-size:11px;white-space:nowrap">' + esc(af.size || '') + (af.updated ? ' &#183; ' + rel(af.updated) : '') + '</span></div>'
    + (fmRows ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;padding-bottom:14px">' + fmRows + '</div>' : '')
    + bodyPane(af)
    + '</section></div>'
}

/* == src/views/config.mjs == */
// Config: sectioned key/value tables or the raw JSON, straight from the served snapshot.




function fmtV(v) {
  if (Array.isArray(v)) return v.length === 0 ? '[ ]' : v.map(function (x) { return typeof x === 'object' && x !== null ? Object.values(x).join(' / ') : String(x) }).join(', ')
  if (typeof v === 'object' && v !== null) return Object.keys(v).map(function (k) { return k + ': ' + fmtV(v[k]) }).join(' · ')
  return v === '' ? '(empty)' : String(v)
}

function vConfig() {
  const config = cfg()
  const bar = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px">'
    + '<div class="seg">'
    + '<button data-act="cfgmode" data-v="table" class="' + (S.configMode === 'table' ? 'active' : '') + '">table</button>'
    + '<button data-act="cfgmode" data-v="raw" class="' + (S.configMode === 'raw' ? 'active' : '') + '">raw json</button></div>'
    + '<span style="color:var(--dim);font-size:11.5px">.claude/major-tom.json &#183; schemaVersion ' + esc(config.schemaVersion != null ? config.schemaVersion : '?') + '</span>'
    + '<span class="chip" style="margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--ok-soft);color:var(--ok);font-size:11.5px"><span class="dot"></span>validated at onboard</span></div>'
  if (S.configMode === 'raw') {
    return bar + '<section class="panel"><div class="panel-head"><span class="eyebrow">raw</span></div>'
      + '<pre class="body" style="white-space:pre;overflow:auto">' + esc(JSON.stringify(config, null, 2)) + '</pre></section>'
  }
  const sections = Object.keys(config).map(function (key) {
    const v = config[key]
    let rows
    if (Array.isArray(v)) rows = v.length ? v.map(function (x, i) { return { k: '[' + i + ']', v: fmtV(x) } }) : [{ k: '[ ]', v: '(empty)' }]
    else if (typeof v === 'object' && v !== null) rows = Object.keys(v).map(function (k) { return { k: k, v: fmtV(v[k]) } })
    else rows = [{ k: key, v: fmtV(v) }]
    return '<section class="panel"><div class="panel-head">'
      + '<span class="sans" style="font-size:14px;font-weight:600">' + esc(key) + '</span></div>'
      + '<div style="display:flex;flex-direction:column;gap:2px">'
      + rows.map(function (r) {

          + '<span style="flex:0 0 160px;color:var(--dim);font-size:11.5px;word-break:break-word">' + esc(r.k) + '</span>'
          + '<span style="flex:1 1 auto;min-width:0;color:' + (r.v === '(empty)' ? 'var(--dimmer)' : 'var(--text)') + ';word-break:break-word">' + esc(r.v) + '</span></div>'
      }).join('') + '</div></section>'
  }).join('')
  return bar + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-items:start">' + sections + '</div>'
}

/* == src/main.mjs == */
// Bootstrap: chrome (rail + header), the load lifecycle, view dispatch, event delegation,
// router.
//
// The page boots asynchronously now (D43 point 7). It used to be able to render at module
// load, because the data was already in the document; with the data behind a fetch it renders
// the chrome and a loading state first, then the views once the snapshot is stored. Nothing
// below ever dispatches a view against an absent snapshot, and a failed fetch is a rendered
// state rather than a console message: D43 point 2 removed the degraded path, so there is no
// embedded copy behind the failure and the error state is the only thing left to show.
//
// This module is also the only one that talks to api.mjs. The views stayed pure string
// builders: they read state and never fetch, so the knowledge body request is issued here on
// their behalf and parked in S.











const VIEW_FN = { overview: vOverview, roadmap: vRoadmap, timeline: vTimeline, git: vGit, knowledge: vKnowledge, config: vConfig }

function renderRail() {
  const config = cfg()
  const items = [
    ['overview', '◈', ''], ['roadmap', '⌗', roadmap().length || ''], ['timeline', '⧖', timelineStream().length || ''],
    ['git', '⎇', commits().length || ''], ['knowledge', '▤', files().length || ''],
    ['config', '{ }', Object.keys(config).length || '']
  ]
  document.getElementById('rail').innerHTML =
    '<div class="brand"><div class="brand-badge">MT</div>'
    + '<div class="rail-label" style="display:flex;flex-direction:column">'
    + '<span class="sans" style="font-size:14px;font-weight:600;letter-spacing:-.01em">Major Tom</span>'
    + '<span style="font-size:10.5px;color:var(--dimmer)">' + esc(config.onboard && config.onboard.pluginVersion ? 'v' + config.onboard.pluginVersion : '') + '</span></div></div>'
    + items.map(function (it) {
      return '<button class="navbtn ' + (S.view === it[0] ? 'active' : '') + '" data-act="view" data-v="' + it[0] + '" title="' + it[0] + '">'
        + '<span class="glyph">' + it[1] + '</span><span class="rail-label">' + it[0] + '</span>'
        + (it[2] !== '' ? '<span class="count rail-label">' + it[2] + '</span>' : '') + '</button>'
    }).join('')
    + '<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">'
    + '<button class="navbtn" data-act="theme" title="Theme"><span style="flex:0 0 22px;text-align:center">' + (S.theme === 'light' ? '◑' : '◐') + '</span><span class="rail-label">' + S.theme + '</span></button>'
    + '<button class="navbtn" data-act="rail" title="Collapse"><span style="flex:0 0 22px;text-align:center">' + (S.rail ? '«' : '»') + '</span><span class="rail-label">collapse</span></button>'
    + '</div>'
}

// The time of the last computation, which is what generatedAt now means: the server stamps it
// when it computes, and it moves on every refresh instead of being frozen at onboard time.
function pillTime() {
  const at = generatedAt()
  if (!at) return 'n/a'
  const hm = clock(at)
  return hm ? hm + ' (' + rel(at) + ')' : String(at)
}

function pillLabel() {
  if (S.busy) return S.hasData ? 'recomputing, last ' + pillTime() : 'computing'
  if (S.status === 'failed') return S.hasData ? 'stale, last computed ' + pillTime() : 'not computed'
  return 'computed ' + pillTime()
}

// The header pill of D43 point 5: the time of the last computation with the refresh control
// beside it, in the pill that used to read "snapshot <generatedAt>". Refresh is the same
// GET /api/snapshot issued again, because the server keeps no cache and has no recompute verb.
// While a request is in flight the control says so and is disabled; loadSnapshot refuses a
// second one anyway, so two clicks can never put two requests in the air.
function headerHtml() {
  const config = cfg()
  const p = config.project || {}
  const ex = config.execution || {}
  const teamPill = ex.workingModel === 'team' && ex.team
    ? 'team &#183; ' + ((ex.team.members || []).length) + ' + coordinator'
    : esc(ex.workingModel || '')
  return '<header class="top"><div style="display:flex;flex-direction:column;gap:2px;min-width:0">'
    + '<h1 class="sans">' + esc(S.view) + '</h1>'
    + '<span style="color:var(--dim);font-size:12px">' + esc(subtitles()[S.view]) + '</span></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap">'
    + '<span class="pill"><span class="dot' + (S.busy ? ' pulse' : '') + '"' + (S.status === 'failed' ? ' style="background:var(--stop)"' : '') + '></span>'
    + esc(pillLabel())
    + '<button class="pill-btn" data-act="refresh" title="Recompute the snapshot on the server"'
    + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'working' : 'refresh') + '</button></span>'
    + (p.name ? '<span class="pill">' + esc(p.name) + (p.topology ? ' &#183; ' + esc(p.topology) : '') + '</span>' : '')
    + (teamPill ? '<span class="pill accent">' + teamPill + '</span>' : '')
    + '</div></header>'
}

function loadingPanel() {
  return '<section class="panel"><div class="panel-head"><span class="eyebrow">loading</span>'
    + '<span class="dot pulse" style="margin-left:auto"></span></div>'
    + '<div class="empty">Computing the snapshot on the server and fetching it.</div></section>'
}

// The whole main area when no snapshot has ever loaded. It names the request that failed and
// repeats the message the server sent, because that message is the only diagnosis the user
// gets: there is no island behind this page and no stale copy to show instead.
function errorPanel() {
  return '<section class="panel"><div class="panel-head"><span class="eyebrow">no data</span>'
    + '<span class="chip" style="color:var(--stop)">' + esc(S.errorRoute || 'the request') + ' failed</span></div>'
    + '<div style="padding:2px 2px 12px 2px;font-size:13px;line-height:1.7">'
    + 'The dashboard could not load its data, so there is nothing to show. This page carries no '
    + 'embedded copy to fall back on: the server computes the data on every request.</div>'
    + '<div class="tile" style="padding:14px 16px;color:var(--stop);font-size:12.5px;line-height:1.7;word-break:break-word">'
    + esc(S.error || 'the request failed and said nothing about why') + '</div>'
    + '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px">'
    + '<button class="btn" data-act="refresh"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'retrying' : 'retry') + '</button>'
    + '<span style="color:var(--dimmer);font-size:11.5px">If the server is not running, start it with /major-tom:dashboard.</span>'
    + '</div></section>'
}

// A failed refresh over a snapshot that did load is a different situation: blanking a good
// view because a later request failed would destroy information the user still has. The
// failure is stated above the view it did not manage to replace.
function errorBanner() {
  return '<section class="panel" style="border-color:var(--accent-line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
    + '<span class="chip" style="color:var(--stop)">' + esc(S.errorRoute || 'the request') + ' failed</span>'
    + '<span style="flex:1 1 220px;min-width:0;color:var(--dim);font-size:12px;word-break:break-word">' + esc(S.error) + '</span>'
    + '<span style="color:var(--dimmer);font-size:11.5px">Showing the last snapshot that loaded.</span>'
    + '<button class="btn" data-act="refresh"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'retrying' : 'retry') + '</button></section>'
}

function mainBody() {
  if (!S.hasData) return S.status === 'failed' ? errorPanel() : loadingPanel()
  if (S.view === 'knowledge') syncBody()
  return (S.status === 'failed' ? errorBanner() : '') + VIEW_FN[S.view]()
}

// Keeps the fetched body in step with the selected file. Called from renderMain rather than
// from the view, so views stay pure, and idempotent: it only issues a request when the
// selected file's id is not the one already requested. A refresh resets bodyStatus to idle,
// which is what makes the displayed body reload with the rest of the data.
function syncBody() {
  const list = files()
  const f = list[S.file] || list[0]
  const id = f && typeof f.id === 'string' && f.id !== '' ? f.id : ''
  if (!id) {
    if (S.bodyStatus === 'noid' && S.bodyId === '') return
    S.bodySeq += 1
    S.bodyId = ''
    S.bodyStatus = 'noid'
    S.bodyText = ''
    S.bodyError = ''
    return
  }
  if (id === S.bodyId && S.bodyStatus !== 'idle') return
  requestBody(id)
}

function requestBody(id) {
  S.bodySeq += 1
  S.bodyId = id
  S.bodyStatus = 'loading'
  S.bodyText = ''
  S.bodyError = ''
  const seq = S.bodySeq
  fetchKnowledgeBody(id).then(function (r) {
    // Only the request issued last may write here. Clicking through files faster than the
    // server answers leaves earlier requests in flight, and one of them landing afterwards
    // would put one file's body under another file's name. Comparing sequence numbers rather
    // than ids also covers re-selecting the same file, where the ids would match and a stale
    // failure could still overwrite a fresh success.
    if (seq !== S.bodySeq) return
    if (!r.ok) {
      S.bodyStatus = 'failed'
      S.bodyError = r.error
    } else if (r.data === null || typeof r.data !== 'object' || typeof r.data.body !== 'string') {
      S.bodyStatus = 'failed'
      S.bodyError = 'the server answered ' + r.status + ' without a body for this file'
    } else if (typeof r.data.id === 'string' && r.data.id !== id) {
      S.bodyStatus = 'failed'
      S.bodyError = 'the server answered with the body of a different file'
    } else {
      S.bodyStatus = 'ready'
      S.bodyText = r.data.body
    }
    renderMain()
  })
}

function renderMain() {
  document.getElementById('main').innerHTML = headerHtml() + mainBody()
  const q = document.getElementById('git-q')
  if (q) {
    q.addEventListener('input', function (e) {
      S.query = e.target.value
      renderMain()
      const q2 = document.getElementById('git-q')
      q2.focus()
      q2.setSelectionRange(q2.value.length, q2.value.length)
    })
  }
}

function render() {
  document.title = 'Major Tom: ' + ((cfg().project || {}).name || 'dashboard')
  document.getElementById('app').classList.toggle('collapsed', !S.rail)
  renderRail()
  renderMain()
}

// The load, the refresh and the retry are one function, because on the server they are one
// request: GET /api/snapshot recomputes every time and there is no separate recompute verb
// (D43 point 5). The busy flag is what stops overlapping requests; the disabled control is
// only the visible half of it.
function loadSnapshot() {
  if (S.busy) return
  S.busy = true
  render()
  fetchSnapshot().then(function (r) {
    S.busy = false
    if (r.ok) {
      try {
        setData(r.data)
        S.hasData = true
        S.status = 'ready'
        S.error = ''
        S.errorRoute = ''
        // The bodies on the server may have moved with the rest of the data, so whatever is
        // on screen is re-fetched rather than kept.
        S.bodyStatus = 'idle'
      } catch (e) {
        S.status = 'failed'
        S.errorRoute = 'GET ' + r.route
        S.error = 'the response could not be read as a snapshot (' + (e && e.message ? e.message : String(e)) + ')'
      }
    } else {
      S.status = 'failed'
      S.errorRoute = 'GET ' + r.route
      S.error = r.error
    }
    render()
  })
}

document.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const act = btn.getAttribute('data-act')
  const v = btn.getAttribute('data-v')
  if (act === 'view') { S.view = v; history.replaceState(null, '', '#/' + v); render() }
  else if (act === 'layout') { S.layout = v; renderMain() }
  else if (act === 'filter') { S.filter = v; renderMain() }
  else if (act === 'file') { S.file = Number(v); renderMain() }
  else if (act === 'cfgmode') { S.configMode = v; renderMain() }
  else if (act === 'refresh') { loadSnapshot() }
  else if (act === 'bodyretry') { S.bodyStatus = 'idle'; renderMain() }
  else if (act === 'theme') {
    S.theme = S.theme === 'light' ? 'dark' : 'light'
    localStorage.setItem('mt-theme', S.theme)
    document.documentElement.dataset.theme = S.theme
    render()
  } else if (act === 'rail') {
    S.rail = !S.rail
    localStorage.setItem('mt-rail', S.rail ? '1' : '0')
    render()
  }
})

window.addEventListener('hashchange', function () {
  const h = (location.hash || '').replace(/^#\/?/, '')
  if (VIEWS.indexOf(h) !== -1) { S.view = h; render() }
})

document.documentElement.dataset.theme = S.theme
// The first render happens inside this call, before the fetch is issued, so the loading state
// is on screen while the request is in flight.
loadSnapshot()
})()
</script>
</body>
</html>
