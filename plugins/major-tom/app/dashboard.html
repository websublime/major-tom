/* The design system the chrome and the six views are built from. Square, dense, table first,
   hairline ruled. Every repeated shape is a class here, so the modules concatenate class names
   and keep inline styles for the values only data can supply, such as a bar width.

   The @font-face rules are emitted by the build, which inlines the vendored woff2 faces. This
   file only names the families and their fallbacks. */

:root{
  --bg:#0a0a0b; --panel:#101011; --head:#141416; --row:#0d0d0e; --hover:#17181a;
  --line:#1f2022; --line2:#2c2e31; --text:#e7e8e9; --dim:#9b9da0; --dimmer:#6b6d71;
  --done:#7ea88f; --active:#c2a05e; --idle:#3a3c3f; --neg:#b1727a;
}
:root[data-theme="light"]{
  --bg:#f6f6f5; --panel:#ffffff; --head:#f0f0ef; --row:#fbfbfa; --hover:#f2f2f1;
  --line:#e3e3e2; --line2:#cfd0cf; --text:#131415; --dim:#5c5e61; --dimmer:#8b8d90;
  --done:#3d7a5c; --active:#8a6a1e; --idle:#c6c7c8; --neg:#a1505a;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}
a:hover{color:var(--text);border-bottom-color:var(--text)}
input::placeholder{color:var(--dimmer)}
button{font-family:inherit}
::selection{background:var(--line2)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2)}
::-webkit-scrollbar-track{background:var(--bg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.sans{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

/* Utilities. The mockup reaches for these on nearly every row. */
.push{margin-left:auto}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowrap{white-space:nowrap}
.msg{flex:1 1 320px;min-width:0;word-break:break-word}
.num{font-variant-numeric:tabular-nums}
.sep{border-top:1px solid var(--line)}

/* ---- Shell: rail, header, scrolling body ---------------------------------- */

.app{display:flex;height:100vh;width:100%;overflow:hidden;background:var(--bg)}

nav.rail{flex:0 0 auto;display:flex;flex-direction:column;width:212px;overflow:hidden;
  border-right:1px solid var(--line);background:var(--panel);transition:width .14s ease}
.app.collapsed nav.rail{width:48px}
.app.collapsed .rail-label{opacity:0}
.rail-label{white-space:nowrap;transition:opacity .12s ease}
.brand{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;
  border-bottom:1px solid var(--line)}
.brand-badge{flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line2);display:grid;
  place-items:center;font-size:10px;font-weight:600;color:var(--text)}
.brand-name{white-space:nowrap;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim)}
.brand .count{margin-left:auto;padding-left:12px}
.rail-nav{display:flex;flex-direction:column;padding:8px 0}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;height:34px;padding:0 14px;
  border:0;border-left:2px solid transparent;background:transparent;color:var(--dim);
  font-size:12.5px;cursor:pointer;text-align:left;white-space:nowrap}
.navbtn:hover{background:var(--hover);color:var(--text)}
.navbtn.active{border-left-color:var(--text);background:var(--head);color:var(--text)}
.navbtn .glyph{flex:0 0 auto;width:14px;text-align:center;font-size:12px;color:var(--dimmer)}
.navbtn.active .glyph{color:var(--text)}
.navbtn .count{margin-left:auto}

main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;overflow:hidden}
header.top{flex:0 0 auto;display:flex;align-items:center;gap:16px;height:52px;padding:0 20px;
  border-bottom:1px solid var(--line);background:var(--panel)}
header.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;
  text-transform:capitalize;white-space:nowrap}
.top-sep{color:var(--line2)}
.top-sub{color:var(--dim);font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.top-cells{display:flex;align-items:center;height:100%;margin-left:auto}
.cell{display:flex;align-items:center;gap:8px;height:100%;padding:0 14px;
  border-left:1px solid var(--line);color:var(--dim);font-size:11.5px;white-space:nowrap}

/* The scroll container every view is rendered into. Views emit sections; the gap spaces them. */
.view{flex:1 1 auto;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:20px}

/* A full width correction under the header, with room to wrap. */
.strip{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:9px 20px;
  border-bottom:1px solid var(--line);background:var(--row);font-size:11.5px}
.strip-label{flex:0 0 auto;color:var(--neg);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase}

/* ---- Section --------------------------------------------------------------- */

.panel{border:1px solid var(--line);background:var(--panel);min-width:0}
.panel-head{display:flex;align-items:center;gap:14px;height:34px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--head)}
.panel-head.short{height:30px}
.eyebrow{flex:0 0 auto;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim)}
.panel-meta{margin-left:auto;color:var(--dim);font-size:11.5px;white-space:nowrap}
.panel-note{color:var(--dimmer);font-size:11px}
.pad{padding:14px}
.prose{font-size:13px;line-height:1.7}
.small{font-size:11.5px}
.quote{background:var(--row);color:var(--neg);font-size:12.5px;line-height:1.7;
  word-break:break-word}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;
  background:var(--row)}
.empty{padding:20px 14px;color:var(--dimmer);font-size:12.5px}

/* ---- Table ----------------------------------------------------------------- */

.thead{display:flex;align-items:center;gap:14px;height:30px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--head);color:var(--dim);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:14px;height:32px;padding:0 14px;
  border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row.tall{height:34px}
.row.wrap{height:auto;min-height:32px;padding:6px 14px;align-items:baseline}
.row.kv{height:auto;min-height:28px;gap:16px;padding:4px 16px;align-items:baseline;
  background:var(--row)}
.row.group{height:36px;background:var(--head)}
.row.group:hover{background:var(--head)}

/* Cell conventions. A cell is fixed, elastic or wrapping, and the w- classes are the mockup's
   column widths. */
.c{flex:0 0 auto}
.c-grow{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-wrap{flex:1 1 auto;min-width:0;word-break:break-word;text-wrap:pretty}
.c-right{text-align:right}

/* ---- Marks ----------------------------------------------------------------- */

.sq{flex:0 0 auto;display:inline-block;width:5px;height:5px;background:var(--idle)}
.sq.done{background:var(--done)}
.sq.active{background:var(--active)}
.sq.idle{background:var(--idle)}
.sq.neg{background:var(--neg)}
.sq.busy{animation:pulse 2.6s infinite}
.bar{flex:0 0 auto;display:block;height:2px;background:var(--idle)}
.bar>span{display:block;height:2px;background:var(--text)}
.bar>span.done{background:var(--done)}
.bar>span.active{background:var(--active)}
.bar>span.idle{background:var(--idle)}
.bar>span.neg{background:var(--neg)}
.bar.wide,.bar.wide>span{height:3px}
.count{color:var(--dimmer);font-size:11px;font-variant-numeric:tabular-nums}
.status{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}

/* ---- Controls -------------------------------------------------------------- */

.btn{padding:2px 8px;border:1px solid var(--line2);background:transparent;color:var(--text);
  font-size:11.5px;cursor:pointer}
.btn:hover:enabled{border-color:var(--text)}
.btn:disabled{cursor:default;color:var(--dimmer);border-color:var(--line)}
.seg{display:flex;border:1px solid var(--line);background:var(--panel)}
.seg button{height:28px;padding:0 12px;border:0;border-left:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:11.5px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--head);color:var(--text)}
.filter{flex:0 0 300px;display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;
  border:1px solid var(--line);background:var(--panel)}
.filter>span{flex:0 0 auto;color:var(--dimmer);font-size:12px}
.filter input{flex:1 1 auto;min-width:0;border:0;outline:none;background:transparent;
  color:var(--text);font-family:inherit;font-size:12.5px}
.win-in{width:40px;padding:1px 2px;border:0;border-bottom:1px solid var(--line2);
  background:transparent;color:var(--text);font-family:inherit;font-size:11.5px;text-align:right}
.win-in:focus{outline:none;border-bottom-color:var(--text)}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* ---- Composition ----------------------------------------------------------- */

.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;
  align-items:start}
.grid2 .span2{grid-column:1 / -1}
.gridk{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr);gap:20px;
  align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.stack.tight{gap:14px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.phase{display:flex;flex-direction:column;gap:9px;min-width:0;padding:12px 14px;
  border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:-1px}
.phase.on{background:var(--head)}
.phase-top{display:flex;align-items:center;gap:8px}
.phase-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.treebtn{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 14px;
  border:0;border-bottom:1px solid var(--line);border-left:2px solid transparent;
  background:transparent;color:var(--dim);font-size:12.5px;cursor:pointer;text-align:left}
.treebtn:hover{background:var(--hover)}
.treebtn.file{padding-left:28px}
.treebtn.active{border-left-color:var(--text);background:var(--head);color:var(--text)}
.treebtn.dir{background:var(--row);color:var(--dimmer);cursor:default}
.treebtn.dir:hover{background:var(--row)}
pre.body{margin:0;padding:18px 16px;color:var(--text);font-family:inherit;font-size:12.5px;
  line-height:1.75;white-space:pre-wrap;word-break:break-word}
pre.body.raw{padding:16px;line-height:1.7;white-space:pre;overflow:auto}

/* The header carries four cells beside the title, so below this width the subtitle goes.
   The rail already names the view, and every other cell states something nothing else does. */
@media (max-width:1500px){
  .top-sub,.top-sep{display:none}
}

@media (max-width:900px){
  .grid2,.gridk{grid-template-columns:minmax(0,1fr)}
}

/* Column widths. Utilities, so they sit after the components that also set flex. */
.w-mark{flex:0 0 18px}
.w-ref{flex:0 0 52px}
.w-kind{flex:0 0 58px}
.w-sha{flex:0 0 64px}
.w-status{flex:0 0 70px}
.w-when{flex:0 0 88px}
.w-churn{flex:0 0 88px}
.w-author{flex:0 0 130px}
.w-owner{flex:0 0 130px}
.w-fmkey{flex:0 0 150px}
.w-key{flex:0 0 260px}
.w-pct{flex:0 0 34px}
.w-count{flex:0 0 56px}
.w-bar{flex:0 0 92px}

/* Text colour last, so a colour a component sets can be overridden by adding one of these. */
.fg-text{color:var(--text)}
.fg-dim{color:var(--dim)}
.fg-dimmer{color:var(--dimmer)}
.fg-done{color:var(--done)}
.fg-active{color:var(--active)}
.fg-idle{color:var(--idle)}
.fg-neg{color:var(--neg)}
</style>

<body>

<div class="app" id="app">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>

<script>
(function () {
'use strict'

/* == src/api.mjs == */
// Transport, and nothing else (D43 point 7). This module talks to the server the page was
// served from and hands back a plain result object; no derivation, no state and no DOM live
// here. Everything downstream reads `ok` first and never has to reason about HTTP.
//
// The two routes are the whole client-facing contract of the server:
//
//   GET /api/snapshot?days=&limit=   the snapshot for the served repository, over a window
//   GET /api/knowledge/body?id=<id>  the body of the one concept that id addresses
//
// Both are same origin and both are read-only, so no base URL is configurable here: a
// configurable origin would be a way to point this page at a server it was not served by,
// which is surface nobody asked for.
//
// Failure is a value, never an exception. Every path below resolves, never rejects, with
// `{ ok: false, route, status, error }`, and the error string is the one the server sent
// whenever it sent one (the server answers a refused input with `{ error: "<message>" }`,
// which is the message the user actually needs). This matters more here than it usually
// would: D43 point 2 dropped the degraded path, so a failed fetch has no embedded data to
// fall back on and the message is the only thing the page can show.

const SNAPSHOT_ROUTE = '/api/snapshot'
const BODY_ROUTE = '/api/knowledge/body'

function describe(e) {
  return e && e.message ? String(e.message) : String(e)
}

// The first line of a non-JSON error body, clipped. Our server never takes this path: it
// answers every failure, the 404s and the 405 included, as JSON `{error}`, so the branch above
// reads the served message instead. This exists for a body that is not JSON at all, which
// means something other than our server produced it (a proxy, a captive portal, a stray HTML
// error page). Such a body is worth one clipped line as a clue and no more, hence the clip.
function firstLine(text) {
  const line = String(text == null ? '' : text).split('\n')[0].trim()
  return line.length > 200 ? line.slice(0, 200) + '...' : line
}

// One request, one result object. Reads the body as text first and parses it here rather than
// calling res.json(), because the error path needs the raw text when the body is not JSON and
// res.json() would have consumed the stream by then.
function requestJson(route) {
  let status = 0
  return fetch(route, { method: 'GET', cache: 'no-store', headers: { Accept: 'application/json' } })
    .then(function (res) {
      status = res.status
      return res.text().then(function (text) {
        return { ok: res.ok, text: text }
      })
    })
    .then(function (res) {
      let parsed = false
      let payload = null
      let parseError = ''
      try {
        payload = JSON.parse(res.text)
        parsed = true
      } catch (e) {
        parseError = describe(e)
      }
      const served = parsed && payload !== null && typeof payload === 'object'
        && typeof payload.error === 'string' && payload.error !== '' ? payload.error : ''
      if (!res.ok) {
        const body = firstLine(res.text)
        return {
          ok: false, route: route, status: status,
          error: served || (body
            ? 'the server answered HTTP ' + status + ': ' + body
            : 'the server answered HTTP ' + status + ' with an empty body')
        }
      }
      if (!parsed) {
        return {
          ok: false, route: route, status: status,
          error: 'the server answered HTTP ' + status + ' with a body that is not JSON (' + parseError + ')'
        }
      }
      return { ok: true, route: route, status: status, data: payload }
    })
    .catch(function (e) {
      // No response at all: the server is not running, was stopped mid-session, or the
      // connection failed. Naming the origin matters, because the usual cause is that the
      // process behind it is gone and the user is the one who has to start it again.
      return {
        ok: false, route: route, status: status,
        error: 'the request to ' + route + ' did not complete (' + describe(e) + ')'
      }
    })
}

// The whole snapshot. Recomputed by the server on every call, so this is equally the load
// request and the refresh request: D43 point 5's explicit recompute is this same request
// issued again, and there is no separate verb to call.
//
// `win` is the window of D45: null when the reader has chosen none, in which case no parameter
// travels and the server applies the configured default, or an object carrying both `days` and
// `limit`. This is the one place the query is built, and it is built from both keys or from
// neither, which is what makes the two parameters travel together by construction rather than
// by discipline: there is no path through this function that puts one of them on the wire
// without the other. That is D45 point 4 at the client layer, and D42 is why it matters, both
// streams being cut by one window; a request that moved only one would recreate exactly the
// ragged reading D42 was written to prevent.
//
// The values go out as the reader typed them, never coerced and never clamped here. The bounds
// are the server's and it refuses rather than clamps (D45 point 2), so a copy of them in this
// file would be a second source of truth for one rule, and worse, it would replace the server's
// own sentence, which names the parameter, the value received and the accepted range, with a
// guess made here.
function fetchSnapshot(win) {
  if (win === null || win === undefined) return requestJson(SNAPSHOT_ROUTE)
  return requestJson(SNAPSHOT_ROUTE
    + '?days=' + encodeURIComponent(String(win.days == null ? '' : win.days))
    + '&limit=' + encodeURIComponent(String(win.limit == null ? '' : win.limit)))
}

// The body of one concept, addressed by the opaque id its listing entry carries. The id is
// minted by the server and never built here, so the client holds no knowledge path at all.
function fetchKnowledgeBody(id) {
  return requestJson(BODY_ROUTE + '?id=' + encodeURIComponent(String(id == null ? '' : id)))
}

/* == src/data.mjs == */
// Snapshot derivations. The input is the JSON the server computed and api.mjs fetched
// (D43 point 7); the data island this module used to parse is gone with `render.js inject`.
//
// What changed and what did not. Every derivation below is the one that was here before, with
// the same defensive reading: a missing key, a malformed key and a wrong type are all tolerated
// at every level, because a snapshot from an older producer must degrade into an honest empty
// view instead of a broken page. What changed is only when they run. They used to be top-level
// constants evaluated at module load, which an asynchronous fetch makes impossible, so the
// module now holds one stored derivation and exposes accessors over it.
//
// Derived once per stored snapshot, not once per accessor call: setData does the work and the
// accessors are lookups. That keeps the cost and the internal consistency of a single load
// exactly where they were, and it keeps the relative times (`rel`) fixed between refreshes
// rather than drifting under a view that is re-rendered on every keystroke.
//
// Before the first load, and after a failed one, the store holds the derivation of an empty
// snapshot: the chrome renders honest zeros while state.mjs carries what is actually going on.

// The five canonical areas of section 11, in the order that section declares them. They are a
// convention, not a schema: OQ-7 leaves the bundle's internal layout open. So this list is used
// to order the groups the bundle actually holds and to keep the overview's five tiles present
// even at zero; it never decides which groups exist. See deriveGroups.
const AREAS = ['memories', 'docs', 'runs', 'monitors', 'logs']

// The label of the group holding the concepts that sit at the bundle root, with no directory
// above them. It starts with a slash on purpose: a path segment can never contain one, so this
// label cannot collide with the label of a real directory however that directory is named,
// including a directory literally called "(bundle root)".
const ROOT_GROUP_LABEL = '/ (bundle root)'

// The kind mapping the mockup states, and a tier mapping built to match it. A tier reads at the
// weight of the commit kind it resembles, so a substantive intent takes the colour of a feat and
// a trivial one the colour of a chore. A run is --done, which no tier uses, so the two streams
// stay apart at a glance.
//
// Both are Maps because both are keyed by a word the repository wrote. A plain object answers
// `constructor` and `toString` with an inherited member, and that member would then be written
// into a style attribute as if it were a colour. A Map holds only what was put in it, so an
// unknown key misses and falls back by construction rather than by luck.
const KIND_COLOR = new Map([
  ['feat', 'var(--text)'], ['fix', 'var(--neg)'], ['docs', 'var(--dim)'],
  ['test', 'var(--done)'], ['chore', 'var(--dimmer)'], ['refactor', 'var(--active)']
])
const TIER_COLOR = new Map([
  ['trivial', 'var(--dimmer)'], ['task', 'var(--active)'], ['substantive', 'var(--text)']
])

function rel(iso) {
  if (!iso) return ''
  const t = Date.parse(iso)
  if (isNaN(t)) return String(iso)
  const m = Math.round((Date.now() - t) / 60000)
  if (m < 1) return 'now'
  if (m < 60) return m + ' min ago'
  if (m < 1440) return Math.round(m / 60) + ' h ago'
  return Math.round(m / 1440) + ' d ago'
}

// The calendar day a timestamp falls on, which is how a dated record reads. Anything that
// does not parse is shown as it was written.
function day(iso) {
  if (!iso) return ''
  const t = Date.parse(iso)
  if (isNaN(t)) return String(iso)
  const d = new Date(t)
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
}

function clock(iso) {
  const t = Date.parse(iso)
  if (isNaN(t)) return ''
  const d = new Date(t)
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
}

// The commit subject without the conventional prefix, which the kind column states beside it.
// The prefix is only removed when it parses as one, so a subject like 'fix the build' is
// untouched. The snapshot keeps serving the full subject; this is presentation.
function conventionalBody(subject) {
  return String(subject).replace(/^(feat|fix|docs|test|chore|refactor)(\([^)]*\))?!?:\s*/, '')
}

// Every commit carries its subject twice. `subject` is the cell, stripped of a prefix the kind
// column already states; `fullSubject` is the line the repository wrote, prefix and scope
// included. The git filter searches `fullSubject`, so a word that only lives in the prefix, such
// as the scope in `chore(release):`, still matches what the reader typed.
function deriveCommits(raw) {
  return (Array.isArray(raw.git) ? raw.git : []).map(function (c) {
    const kind = c.kind || (String(c.subject || '').match(/^(feat|fix|docs|test|chore|refactor)/) || [])[1] || 'other'
    return {
      sha: String(c.hash || '').slice(0, 7), kind: kind, kindColor: KIND_COLOR.get(kind) || 'var(--dim)',
      subject: conventionalBody(c.subject || ''), fullSubject: String(c.subject || ''),
      author: c.author || '', add: c.add, del: c.del,
      when: rel(c.date), date: c.date || ''
    }
  })
}

// One entry per concept. Bodies no longer travel here (D43 point 4): each entry carries the
// opaque `id` the server minted for it, and views.knowledge fetches one body at a time through
// api.mjs. A string entry is still accepted, which is what a producer older than schema v2
// wrote, and such an entry simply has no id to fetch with.
function deriveFiles(raw) {
  return ((raw.knowledge || {}).files || []).map(function (f) {
    return typeof f === 'string' ? { path: f } : f
  })
}

// The one grouping of the knowledge listing, read by the tree (views/knowledge.mjs) and by the
// overview's per-area counts alike. Every entry of knowledge.files[] lands in exactly one group,
// keyed by the first segment of its path.
//
// Why the first segment rather than the five canonical areas. Section 11 declares memories,
// docs, runs, monitors and logs as the convention, but OQ-7 leaves the bundle's internal layout
// open, so the bundle may legitimately hold a concept the convention does not predict: in a
// directory nobody declared, or at the bundle root itself. Grouping against a fixed list drops
// such a file out of the tree entirely while still counting it in the rail, which is how a file
// became invisible and, once bodies are fetched for the selected file only, unreachable. A view
// that silently drops a file it was given is worse than one that shows an unexpected group. The
// five areas still appear whenever they hold something, because they emerge from the data like
// any other group.
//
// The grouping is a partition, which is what makes the counts add up and what guarantees the
// tree renders exactly one button per file: a nested path contributes to its first segment only,
// so memories/docs/x.md is one entry under memories and not one under each.
//
// Each entry keeps the index it has in files(), because that index is what a tree button carries
// and what selects the file. Grouping reorders the presentation and never the array.
//
// Group order: the canonical areas first, in the order section 11 declares them, then every
// other directory in code-unit order, then the bundle root last. The convention leads because it
// is what a reader expects to find; anything outside it collects below, where it reads as the
// exception it is; the root group is the least ordinary of all, so it closes the list. Code-unit
// order rather than localeCompare, so the same bundle renders identically under every locale.
// Files inside a group keep the snapshot's own order, which the producer already fixed.
function deriveGroups(fileList) {
  const byDir = new Map()
  const rootEntries = []
  fileList.forEach(function (f, i) {
    const parts = String(f.path == null ? '' : f.path).split('/')
    // A single segment is a file at the bundle root. So is a path with an empty first segment
    // (a leading slash) and so is a missing path: neither names a directory to group under.
    if (parts.length < 2 || parts[0] === '') {
      rootEntries.push({ file: f, index: i })
      return
    }
    if (!byDir.has(parts[0])) byDir.set(parts[0], [])
    byDir.get(parts[0]).push({ file: f, index: i })
  })
  const others = []
  byDir.forEach(function (entries, dir) { if (AREAS.indexOf(dir) === -1) others.push(dir) })
  others.sort(function (a, b) { return a < b ? -1 : a > b ? 1 : 0 })
  const out = AREAS.filter(function (a) { return byDir.has(a) })
    .concat(others)
    .map(function (dir) { return { dir: dir, label: dir, entries: byDir.get(dir) } })
  if (rootEntries.length) out.push({ dir: null, label: ROOT_GROUP_LABEL, entries: rootEntries })
  return out
}

// The overview's knowledge tiles: one per canonical area, one per group outside the convention,
// and the total last. Built from the same partition as the tree, so the area tiles now sum to
// the total instead of quietly omitting whatever lives outside the five areas.
//
// What this changes and what it does not. The five canonical tiles are still always rendered,
// at zero when the area is empty, because the convention is what they state. What they count
// changes in one case: an area name is now matched as the first path segment only, so
// memories/docs/x.md counts under memories alone where it used to count under both memories and
// docs. Double counting is precisely what stopped the tiles from adding up.
function deriveCounts(fileList, groupList) {
  const byDir = new Map()
  groupList.forEach(function (g) { if (g.dir !== null) byDir.set(g.dir, g.entries.length) })
  const out = AREAS.map(function (a) { return { label: a, n: byDir.get(a) || 0 } })
  groupList.forEach(function (g) {
    if (g.dir === null || AREAS.indexOf(g.dir) === -1) out.push({ label: g.label, n: g.entries.length })
  })
  out.push({ label: 'concepts', n: fileList.length })
  return out
}

function deriveDecisions(raw, fileList) {
  return Array.isArray(raw.decisions) ? raw.decisions : fileList
    .filter(function (f) { return f.frontmatter && f.frontmatter.type === 'decision' })
    .map(function (f) {
      return {
        id: f.frontmatter.id || f.path, text: f.frontmatter.title || f.path,
        // date precedence mirrors buildDecisions in plugins/major-tom/app/snapshot.js:
        // the declared frontmatter date, the file mtime otherwise. The two derivations of
        // this one field are deliberately coupled, so keep them in step.
        date: f.frontmatter.date || f.updated || '', status: f.frontmatter.status === 'open' ? 'open' : 'closed'
      }
    })
}

// The timeline key (D41). Optional: a snapshot from a producer older than it lacks the key
// entirely, so a missing or malformed key degrades to an empty view that states what it does
// not have. Commits are deliberately not part of it; the view merges the git key in client side.
//
// `window` no longer carries `byteBudget` and `omitted.reason` can no longer be "bytes"
// (D43 point 4 dropped the 256 KB timeline budget along with the knowledge caps). The days
// horizon, the floor and the ceiling survive untouched, as a legibility choice rather than a
// weight one. A snapshot old enough to still carry a byteBudget simply has a member nothing
// reads; the view states the window it is given and nothing else.
function deriveTimeline(raw) {
  const t = raw.timeline && typeof raw.timeline === 'object' && !Array.isArray(raw.timeline) ? raw.timeline : null
  const source = t && Array.isArray(t.events) ? t.events : []
  const events = source.filter(function (e) { return e && typeof e === 'object' }).map(function (e) {
    const isRun = e.kind === 'run'
    const tier = isRun || e.tier == null ? null : String(e.tier)
    const sid = e.sessionId == null ? '' : String(e.sessionId)
    const ms = Date.parse(e.at)
    return {
      stream: 'event', kind: isRun ? 'run' : 'intent', tier: tier,
      type: isRun || e.type == null ? null : String(e.type),
      color: isRun ? 'var(--done)' : (TIER_COLOR.get(tier) || 'var(--dim)'),
      text: e.summary == null ? '' : String(e.summary),
      truncated: e.summaryTruncated === true,
      promptId: e.promptId == null ? '' : String(e.promptId),
      sessionId: sid, session: sid ? sid.slice(0, 8) : '',
      path: e.path == null ? '' : String(e.path),
      date: e.at || '', when: rel(e.at), at: isNaN(ms) ? null : ms
    }
  })
  const w = t && t.window && typeof t.window === 'object' ? t.window : null
  const o = t && t.omitted && typeof t.omitted === 'object' ? t.omitted : null
  return {
    present: !!t, events: events,
    window: w ? { days: w.days, floorEvents: w.floorEvents, ceilingEvents: w.ceilingEvents } : null,
    omitted: o ? { count: Number(o.count) || 0, oldestKept: o.oldestKept || '', reason: o.reason == null ? null : String(o.reason) } : null
  }
}

// The one place a whole snapshot is turned into the shape the views read.
//
// The top-level guard is the single tolerance this rewrite adds, and it is added because the
// input genuinely changed: the island could only ever hold what the renderer put there, while
// a response body is whatever arrived, including `null` or an array. Everything below it reads
// exactly as defensively as it did before.
function derive(raw) {
  const data = raw !== null && typeof raw === 'object' && !Array.isArray(raw) ? raw : {}
  const config = data.config || {}
  const fileList = deriveFiles(data)
  const groupList = deriveGroups(fileList)
  return {
    data: data,
    cfg: config,
    root: (config.persistence && config.persistence.root) || '.knowledge',
    commits: deriveCommits(data),
    files: fileList,
    groups: groupList,
    counts: deriveCounts(fileList, groupList),
    decisions: deriveDecisions(data, fileList),
    timeline: deriveTimeline(data),
    roadmap: data.roadmap && Array.isArray(data.roadmap.milestones) ? data.roadmap.milestones : [],
    lastRun: data.lastRun || null
  }
}

let CURRENT = derive({})

// Stores one fetched snapshot and derives it. Called by the boot and by every refresh, and by
// nothing else. It throws only if a derivation throws on a genuinely malformed payload, which
// the caller turns into the error state rather than a blank page.
function setData(raw) {
  CURRENT = derive(raw)
}

function generatedAt() { return CURRENT.data.generatedAt || '' }
function cfg() { return CURRENT.cfg }
function root() { return CURRENT.root }
function commits() { return CURRENT.commits }
function files() { return CURRENT.files }
function groups() { return CURRENT.groups }
function counts() { return CURRENT.counts }
function decisions() { return CURRENT.decisions }
function timeline() { return CURRENT.timeline }
function roadmap() { return CURRENT.roadmap }
function lastRun() { return CURRENT.lastRun }

/* == src/state.mjs == */
// Mutable UI state, the load lifecycle, and the view registry metadata.


const VIEWS = ['overview', 'roadmap', 'timeline', 'git', 'knowledge', 'config']

// A function rather than a constant, because two of these count things that only exist once a
// snapshot has been fetched (D43 point 7). Called on every header render, so it always states
// the data actually on screen and not the data that was there when the page loaded.
function subtitles() {
  return {
    overview: 'lifecycle state, roadmap and knowledge at a glance',
    roadmap: 'overall progress, milestones and their tasks',
    timeline: timeline().events.length + '-event window merged with the commit stream',
    git: commits().length + '-commit window from the snapshot',
    knowledge: root() + ' as an OKF 0.2 bundle',
    config: 'single source of truth for every plugin surface'
  }
}

const S = {
  view: 'overview', rail: localStorage.getItem('mt-rail') !== '0',
  theme: localStorage.getItem('mt-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'),
  filter: 'all', query: '', file: 0, configMode: 'table',

  // The load lifecycle. `status` is 'loading' until the first snapshot arrives, then 'ready'
  // or 'failed'; it never returns to 'loading' once data is on screen, because a refresh over
  // a rendered view must not blank it. `busy` is the in-flight flag that both states share,
  // and it is what stops the refresh control from issuing overlapping requests. `hasData` says
  // whether a snapshot ever landed, which is what separates "nothing to show" from "a refresh
  // failed over something worth keeping on screen". `error` is the message the server sent,
  // which is all the page has to show once D43 point 2 removed the fallback, and `errorRoute`
  // names the request that failed.
  status: 'loading', busy: false, hasData: false, error: '', errorRoute: '',

  // The window of D45, which is the one the timeline events and the git commits are both cut
  // by (D42, D45 point 4). Three fields, and the split between them is what the control needs
  // to stay honest.
  //
  // `window` is the window the reader chose, and it is null until a choice is made: null means
  // no parameters travel and the server applies the configured default, which is what puts a
  // reload back on the default without anything having to reset it. It is not in localStorage
  // and not in the URL, deliberately (D45 point 3): the parameter is an adjustment to a reading
  // session, not a setting, and the config stays the single source of truth for the window a
  // project shows. The theme and the rail state above are stored, and that precedent was
  // considered and rejected here, because a stored window would make what this page shows no
  // longer derivable from the config alone.
  //
  // `windowDraft` is what the two fields hold. It is re-synced from the effective window of
  // every snapshot that lands, so the control states the window on screen rather than a
  // constant, and it is left exactly as typed when a request is refused, so the reader corrects
  // the value in place instead of retyping it.
  //
  // `windowError` is the message the server sent when it refused the window. It is kept apart
  // from `error` above on purpose: `error` means no snapshot could be computed, while this one

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  })
}

// Every status word collapses to one of three states, and the word this returns is both the
// token name and the class stem: `sq done`, `fg-active`, a bar fill of `idle`.
function uiStatusKey(st) {
  if (st === 'done') return 'done'
  if (st === 'active') return 'active'
  return st === 'failed' ? 'neg' : 'idle'
}

// The overview's git brief renders one commit per row. The full log has its own row in
// views/git.mjs.
function commitRow(c) {
  return '<div class="row">'
    + '<span class="w-sha fg-dim small">' + esc(c.sha) + '</span>'
    + '<span class="w-kind fg-dimmer small">' + esc(c.kind) + '</span>'
    + '<span class="c-grow">' + esc(c.subject) + '</span>'
    + '<span class="w-when c-right count">' + esc(c.when) + '</span>'
    + '</div>'

// `mark` is already an HTML entity, so a view writes it without escaping it.
function milestoneVm(m) {
  const tasks = Array.isArray(m.tasks) ? m.tasks : []
  const done = tasks.filter(function (t) { return t.status === 'done' }).length
  return {
    title: m.title || '', version: m.version || '', status: m.status || 'planned',
    pct: m.pct != null ? m.pct : (tasks.length ? Math.round(done / tasks.length * 100) : 0),
    key: uiStatusKey(m.status), done: done, total: tasks.length,
    tasks: tasks.map(function (t) {
      const st = t.status || 'todo'
      return {
        ref: t.ref || '', title: t.title || '', owner: t.owner || '', status: st,
        key: uiStatusKey(st),
        mark: st === 'done' ? '&#10003;' : st === 'active' ? '&#9656;' : '&#183;'
      }
    })
  }
}

function decisionRow(d) {
  const open = d.status === 'open'
  return '<div class="row">'
    + '<span class="w-ref small ellip ' + (open ? 'fg-active' : 'fg-done') + '" title="' + esc(d.id) + '">' + esc(d.id) + '</span>'
    + '<span class="c-grow' + (open ? '' : ' fg-dim') + '">' + esc(d.text) + '</span>'
    + '<span class="c c-right count">' + esc(open ? 'open' : day(d.date)) + '</span>'
    + '</div>'
}

// phaseVms returns one view model per phase of the last run, and null when no run was recorded.
// `pct` fills the phase bar, and only a finished phase has a measured one, so an unfinished
// phase reads 0.
function phaseVms() {
  const run = lastRun()
  if (!run || !Array.isArray(run.phases)) return null
  return run.phases.map(function (p, i) {
    const st = p.status || 'pending'
    return {
      num: String(i + 1).padStart(2, '0'), name: p.name || '', artifact: p.artifact || '',
      status: st, elapsed: p.elapsed || '', key: uiStatusKey(st),
      pct: st === 'done' ? 100 : 0
    }
  })
}

/* == src/views/timeline.mjs == */
// Timeline: the recorded intent and run stream (snapshot key `timeline`, D41) merged
// client side with the commit stream, newest first, grouped by day and then by session.
// Commits are never duplicated into the key; the merge happens here.



// The two limits that can bite, and the only two the server can now report: D43 point 4
// dropped the 256 KB timeline budget, so "bytes" left the set of reasons along with it. An
// unrecognised reason still prints verbatim rather than being swallowed, which is how a
// snapshot from an older producer still states honestly why it dropped events.
const REASON_TEXT = {
  days: 'days (the day horizon)',
  ceiling: 'ceiling (the event ceiling)'
}

function stated(v) {
  return v == null || v === '' ? 'not stated' : String(v)
}

function reasonText(r) {
  if (r == null || r === '') return 'not stated'
  return REASON_TEXT[r] || String(r)
}

function dayKey(ms) {
  if (ms == null) return ''
  const d = new Date(ms)
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
}

function dayLabel(key) {
  if (!key) return 'undated'
  const today = new Date()
  const yesterday = new Date()
  yesterday.setDate(yesterday.getDate() - 1)
  if (key === dayKey(today.getTime())) return 'today'
  if (key === dayKey(yesterday.getTime())) return 'yesterday'
  return key
}

function groupKey(it) {
  return it.stream === 'commit' ? 'commit' : 'session:' + it.session
}

function groupLabel(it) {
  if (it.stream === 'commit') return 'git'
  return it.session ? 'session ' + it.session : 'no session id'
}

// The merged stream: timeline events plus commits, one chronological order, newest first.
// Items with an unparseable date keep their place at the end rather than being dropped.
function timelineStream() {
  const commitItems = commits().map(function (c) {
    const ms = Date.parse(c.date)
    return {
      stream: 'commit', kind: 'commit', mark: c.sha, label: c.kind, color: c.kindColor,
      text: c.subject, truncated: false, session: '', path: '',
      date: c.date, when: c.when, at: isNaN(ms) ? null : ms
    }
  })
  const events = timeline().events.map(function (e) {
    return {
      stream: 'event', kind: e.kind, mark: e.kind === 'run' ? 'run' : 'intent',
      label: e.kind === 'run' ? '' : (e.tier || 'intent') + (e.type ? ' ' + e.type : ''),
      color: e.color, text: e.text, truncated: e.truncated, session: e.session, path: e.path,
      date: e.date, when: e.when, at: e.at
    }
  })
  return events.concat(commitItems).sort(function (a, b) {
    if (a.at == null && b.at == null) return 0
    if (a.at == null) return 1
    if (b.at == null) return -1
    return b.at - a.at
  })
}

// One row of the merged stream, at the width of the git table. The overview's activity strip
// calls this too, so the row states itself and takes nothing from its table.
//
// A commit is marked by its sha in the neutral column colour; an event is marked by the stream
// it came from, coloured by its tier. The kind column carries the colour in both cases. The
// value is the one data.mjs derived, and it is written inline because a derived colour has no
// class to carry it; the git table's kind column does the same.
function timelineRow(it) {
  const isCommit = it.stream === 'commit'
  return '<div class="row">'
    + '<span class="w-sha small' + (isCommit ? ' fg-dim' : '') + '"'
    + (isCommit ? '' : ' style="color:' + it.color + '"') + '>' + esc(it.mark) + '</span>'
    + '<span class="w-owner ellip small" style="color:' + it.color + '">' + esc(it.label) + '</span>'
    + '<span class="c-grow">' + esc(it.text) + '</span>'
    + (it.truncated
      ? '<span class="c status fg-active" title="summary cut at the 200-character cap">truncated</span>'
      : '')
    + (it.path ? '<span class="w-author c-right ellip count">' + esc(it.path) + '</span>' : '')
    + '<span class="w-when c-right count">' + esc(clock(it.date) || it.when) + '</span>'
    + '</div>'
}

// Plain text, always rendered: the window this view stands on and every omission it was
// told about. Truncation is never silent (D41).
function timelineWindowLine() {
  const t = timeline()
  if (!t.present) {
    return 'This snapshot carries no timeline key: no recorded events and no window to state. '
      + 'Any rows below are commits from the git window.'
  }
  const w = t.window
  const o = t.omitted
  const head = w
    ? 'Window: last ' + stated(w.days) + ' days, floor ' + stated(w.floorEvents) + ' events, ceiling '
      + stated(w.ceilingEvents) + ' events.'
    : 'Window: not stated in this snapshot.'
  let tail
  if (!o) {
    tail = 'No omission record in this snapshot, so how much was left out is unknown.'
  } else if (o.count > 0) {
    tail = o.count + ' event' + (o.count === 1 ? '' : 's') + ' omitted, oldest kept '
      + stated(o.oldestKept) + ', limit that bit: ' + reasonText(o.reason) + '.'
  } else {
    tail = 'Nothing omitted: every event inside the window is shown.'
  }
  return head + ' ' + tail
}

function vTimeline() {
  const stream = timelineStream()
  const eventCount = timeline().events.length
  const commitCount = commits().length
  const tools = '<div class="tools">'
    + '<span class="fg-dim small">' + eventCount + ' recorded event'
    + (eventCount === 1 ? '' : 's') + ' &#183; ' + commitCount + ' commit'
    + (commitCount === 1 ? '' : 's') + '</span>'
    + '<span class="push fg-dim small">' + stream.length + ' in the merged stream</span></div>'
  const windowPanel = '<section class="panel">'
    + '<div class="panel-head short"><span class="eyebrow">window</span></div>'
    + '<div class="pad prose fg-dim">' + esc(timelineWindowLine()) + '</div></section>'

  if (!stream.length) {
    return tools + windowPanel + '<section class="panel"><div class="empty">'
      + 'No events and no commits in this snapshot. The timeline fills in as intents and runs '
      + 'are recorded under the runs area and as commits land in the window.</div></section>'
  }

  const days = []
  stream.forEach(function (it) {
    const key = dayKey(it.at)
    const last = days[days.length - 1]
    if (last && last.key === key) last.items.push(it)
    else days.push({ key: key, items: [it] })
  })

  // One panel per day, one head row per session block inside it. The path column is labelled
  // only when the day holds an item that carries a path.
  return tools + windowPanel + days.map(function (bucket) {
    const blocks = []
    bucket.items.forEach(function (it) {
      const key = groupKey(it)
      const last = blocks[blocks.length - 1]
      if (last && last.key === key) last.items.push(it)
      else blocks.push({ key: key, label: groupLabel(it), items: [it] })
    })
    const hasPath = bucket.items.some(function (it) { return !!it.path })
    return '<section class="panel">'
      + '<div class="panel-head short"><span class="eyebrow">' + esc(dayLabel(bucket.key)) + '</span>'
      + '<span class="panel-meta">' + bucket.items.length + ' item'
      + (bucket.items.length === 1 ? '' : 's') + '</span></div>'
      + '<div class="thead"><span class="w-sha">mark</span><span class="w-owner">kind</span>'
      + '<span class="c-grow">summary</span>'
      + (hasPath ? '<span class="w-author c-right">path</span>' : '')
      + '<span class="w-when c-right">when</span></div>'
      + blocks.map(function (b) {
        return '<div class="row group"><span class="c-grow eyebrow">' + esc(b.label) + '</span>'
          + '<span class="count">' + b.items.length + '</span></div>'
          + b.items.map(timelineRow).join('')
      }).join('')
      + '</section>'
  }).join('')
}

function vGit() {
  const q = S.query.trim().toLowerCase()
  const all = commits()
  // The query runs over `fullSubject`, the line the repository wrote, while the cell shows the
  // stripped one. A word that lives only in the prefix therefore still matches, so typing
  // `release` finds `chore(release): manifests at 0.28.0`, whose cell prints the tail alone.
  const visible = all.filter(function (c) {
    return (S.filter === 'all' || c.kind === S.filter)
      && (!q || (c.fullSubject + ' ' + c.sha + ' ' + c.author).toLowerCase().indexOf(q) !== -1)
  })

  const tools = '<div class="stack tight"><div class="tools">'
    + '<div class="filter"><span>filter</span>'
    + '<input id="git-q" type="text" placeholder="subject, sha, author" value="' + esc(S.query) + '"></div>'
    + '<div class="seg">' + GIT_KINDS.map(function (k) {

    + '<span class="push fg-dim small">' + visible.length + ' of ' + all.length + ' commits</span>'
    + '</div>'

  }

    + '<span class="w-kind">kind</span>'

    + '<span class="c count">' + g.entries.length + '</span>'
    + '</div>'
}

function kTreeFileRow(f, i) {
  const type = (f.frontmatter && f.frontmatter.type) || f.type || ''
  return '<button class="treebtn file' + (S.file === i ? ' active' : '') + '" data-act="file" data-v="' + i + '">'
    + '<span class="c-grow">' + esc((f.path || '').split('/').pop()) + '</span>'
    + '<span class="c count">' + esc(type) + '</span>'
    + '</button>'
}

// The body pane renders whichever state the fetched body is in. A body is missing only because
// the request has not landed, has failed, or because the entry carries no id to ask with.
function bodyPane(af) {
  if (S.bodyStatus === 'noid') {
    return '<div class="empty">This entry carries no id, so its body cannot be fetched. '
      + 'Ids are minted by the server; an entry without one came from a producer older than the body endpoint.</div>'
  }
  if (S.bodyStatus === 'loading') {
    return '<div class="empty">Loading the body of ' + esc(af.path || 'this file') + '.</div>'
  }
  if (S.bodyStatus === 'failed') {
    return '<div class="banner">'
      + '<span class="eyebrow fg-neg">body unavailable</span>'
      + '<span class="msg fg-dim small">'
      + esc(S.bodyError || 'the request failed and the server said nothing about why') + '</span>'
      + '<button class="btn" data-act="bodyretry">retry</button>'
      + '</div>'
  }
  if (S.bodyStatus === 'ready') {
    if (S.bodyText === '') return '<div class="empty">This file has no body: frontmatter only.</div>'
    return '<pre class="body">' + esc(S.bodyText) + '</pre>'
  }
  return '<div class="empty">No body requested for this file yet.</div>'
}

function vKnowledge() {
  const list = files()
  if (!list.length) return '<section class="panel"><div class="empty">The knowledge bundle is empty.</div></section>'
  const af = list[S.file] || list[0]

  // One button per entry of knowledge.files[], and never more or fewer: the groups are the
  // partition data.mjs derives, so the tree and the rail's count state the same number by
  // construction. Group headings and their order are explained at deriveGroups; a heading is
  // escaped because a directory name is data from the served bundle.
  let tree = ''
  groups().forEach(function (g) {
    tree += kTreeDirRow(g)
    g.entries.forEach(function (e) { tree += kTreeFileRow(e.file, e.index) })
  })

  const fm = af.frontmatter || {}
  const fmRows = Object.keys(fm).map(function (k) {
    const v = fm[k]
    return '<div class="row kv">'
      + '<span class="w-fmkey fg-dim small">' + esc(k) + '</span>'
      + '<span class="c-wrap">' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</span>'
      + '</div>'
  }).join('')

  const type = fm.type || af.type || ''
  return '<div class="gridk">'
    + '<section class="panel">'
    + '<div class="panel-head short">'
    + '<span class="eyebrow">' + esc(root()) + '</span>'
    + '<span class="panel-note">okf 0.2</span>'
    + '<span class="panel-meta">' + list.length + ' file' + (list.length === 1 ? '' : 's') + '</span>'
    + '</div>' + tree + '</section>'
    + '<section class="panel">'
    + '<div class="panel-head">'
    + '<span class="c-grow">' + esc(af.path || '') + '</span>'
    + (type ? '<span class="c status fg-dim">' + esc(type) + '</span>' : '')
    + '<span class="panel-meta count">' + esc(af.size || '')
    + (af.updated ? ' &#183; ' + esc(rel(af.updated)) : '') + '</span>'
    + '</div>'
    + fmRows
    + bodyPane(af)
    + '</section>'
    + '</div>'
}

// Config: the served configuration as one sectioned key/value table, or as the raw JSON.




function fmtV(v) {
  if (Array.isArray(v)) return v.length === 0 ? '[ ]' : v.map(function (x) { return typeof x === 'object' && x !== null ? Object.values(x).join(' / ') : String(x) }).join(', ')
  if (typeof v === 'object' && v !== null) return Object.keys(v).map(function (k) { return k + ': ' + fmtV(v[k]) }).join(' · ')
  return v === '' ? '(empty)' : String(v)
}

function cfgLeafRow(k, v) {
  return '<div class="row wrap">'
    + '<span class="w-key fg-dim small">' + esc(k) + '</span>'
    + '<span class="c-wrap' + (v === '(empty)' ? ' fg-dimmer' : '') + '">' + esc(v) + '</span>'
    + '</div>'
}

// One top-level config key renders as one section. An object or an array opens a header row and
// lists its members under it; a scalar states its value on the header row itself, so no key is
// written twice.
function cfgSection(key, v) {
  const head = '<div class="row group"><span class="w-key eyebrow">' + esc(key) + '</span>'
  if (Array.isArray(v)) {
    return head + '</div>' + (v.length
      ? v.map(function (x, i) { return cfgLeafRow('[' + i + ']', fmtV(x)) }).join('')
      : cfgLeafRow('[ ]', '(empty)'))
  }
  if (typeof v === 'object' && v !== null) {
    return head + '</div>' + Object.keys(v).map(function (k) { return cfgLeafRow(k, fmtV(v[k])) }).join('')
  }
  return head + '<span class="c-wrap">' + esc(fmtV(v)) + '</span></div>'
}

function vConfig() {
  const config = cfg()
  // Every return below wraps the tools row and its table in one tight stack, for the reason
  // views/git.mjs gives.
  const tools = '<div class="stack tight"><div class="tools">'
    + '<div class="seg">'
    + '<button data-act="cfgmode" data-v="table"' + (S.configMode === 'table' ? ' class="active"' : '') + '>table</button>'
    + '<button data-act="cfgmode" data-v="raw"' + (S.configMode === 'raw' ? ' class="active"' : '') + '>raw json</button>'
    + '</div>'
    + '<span class="fg-dim small">.claude/major-tom.json &#183; schemaVersion '
    + esc(config.schemaVersion != null ? config.schemaVersion : '?') + '</span>'
    + '<span class="push sq done"></span><span class="fg-dim small">validated at onboard</span>'
    + '</div>'

  if (S.configMode === 'raw') {
    return tools + '<section class="panel">'
      + '<div class="panel-head short"><span class="eyebrow">raw</span></div>'
      + '<pre class="body raw">' + esc(JSON.stringify(config, null, 2)) + '</pre>'
      + '</section></div>'
  }

  const keys = Object.keys(config)
  if (!keys.length) {
    return tools + '<section class="panel"><div class="empty">No configuration in the snapshot.</div></section></div>'
  }
  return tools + '<section class="panel">'
    + '<div class="thead"><span class="w-key">key</span><span class="c-grow">value</span></div>'
    + keys.map(function (key) { return cfgSection(key, config[key]) }).join('')
    + '</section></div>'
}

/* == src/main.mjs == */
// Bootstrap: chrome (rail + header), the load lifecycle, view dispatch, event delegation,
// router.
//
// The page boots asynchronously now (D43 point 7). It used to be able to render at module
// load, because the data was already in the document; with the data behind a fetch it renders
// the chrome and a loading state first, then the views once the snapshot is stored. Nothing
// below ever dispatches a view against an absent snapshot, and a failed fetch is a rendered
// state rather than a console message: D43 point 2 removed the degraded path, so there is no
// embedded copy behind the failure and the error state is the only thing left to show.
//
// This module is also the only one that talks to api.mjs. The views stayed pure string
// builders: they read state and never fetch, so the knowledge body request is issued here on
// their behalf and parked in S.











const VIEW_FN = { overview: vOverview, roadmap: vRoadmap, timeline: vTimeline, git: vGit, knowledge: vKnowledge, config: vConfig }

function renderRail() {
  const config = cfg()
  const version = config.onboard && config.onboard.pluginVersion ? 'v' + config.onboard.pluginVersion : ''
  const items = [
    ['overview', '■', ''], ['roadmap', '≡', roadmap().length || ''], ['timeline', '⧖', timelineStream().length || ''],
    ['git', '⎇', commits().length || ''], ['knowledge', '▤', files().length || ''],
    ['config', '{ }', Object.keys(config).length || '']
  ]
  document.getElementById('rail').innerHTML =
    '<div class="brand"><span class="brand-badge">MT</span>'
    + '<span class="brand-name rail-label">major tom</span>'
    + (version ? '<span class="count rail-label">' + esc(version) + '</span>' : '')
    + '</div><div class="rail-nav">'
    + items.map(function (it) {
      return '<button class="navbtn ' + (S.view === it[0] ? 'active' : '') + '" data-act="view" data-v="' + it[0] + '" title="' + it[0] + '">'
        + '<span class="glyph">' + it[1] + '</span><span class="rail-label">' + it[0] + '</span>'
        + (it[2] !== '' ? '<span class="count rail-label">' + it[2] + '</span>' : '') + '</button>'
    }).join('')
    + '</div><div class="rail-foot">'
    + '<button class="navbtn" data-act="theme" title="Theme"><span class="glyph">' + (S.theme === 'light' ? '◑' : '◐') + '</span><span class="rail-label">' + S.theme + '</span></button>'
    + '<button class="navbtn" data-act="rail" title="Collapse"><span class="glyph">' + (S.rail ? '«' : '»') + '</span><span class="rail-label">collapse</span></button>'
    + '</div>'
}

// The time of the last computation, which is what generatedAt now means: the server stamps it
// when it computes, and it moves on every refresh instead of being frozen at onboard time.
function computedTime() {
  const at = generatedAt()
  if (!at) return 'n/a'
  const hm = clock(at)
  return hm ? hm + ' (' + rel(at) + ')' : String(at)
}

function statusLabel() {
  if (S.busy) return S.hasData ? 'recomputing, last ' + computedTime() : 'computing'
  if (S.status === 'failed') return S.hasData ? 'stale, last computed ' + computedTime() : 'not computed'
  return 'computed ' + computedTime()
}

// The square states the colour and the motion separately, because they answer different
// questions. The colour is where the page stands and the pulse is whether a request is in the
// air, so a retry over a failed page pulses in the failure colour instead of hiding it.
function statusSquare() {
  const colour = S.status === 'failed' ? 'neg' : S.busy ? 'active' : 'done'
  return S.busy ? colour + ' busy' : colour
}

// The window control of D45, a header cell beside the status cell and the refresh control and
// deliberately not inside a view. The window cuts two of the six views, the timeline and
// git, so it belongs where the page's global state already lives and where a reader on any view
// can see which window is in force. Inside one of those two views it would read as that view's
// own setting, which is precisely the reading D42 and D45 point 4 exist to prevent: one window
// cuts both streams, and a control that looked like the timeline's would suggest the git side
// has another.
//
// The control is two fields and an explicit apply, and the fields do not fetch as they change.
// A reader typing a window one character at a time passes through "3", "36" and "365", and each
// of those is a different window a live field would go and fetch, so two requests nobody asked
// for would land before the one that was meant, and the first of them would come back refused.
// Debouncing would only make that wrong answer arrive later. The submit removes the whole class
// of problem instead of timing around it, and it is the same act that carries both numbers in
// one request, so days and limit cannot drift apart. Enter in either field submits too, since a
// pair of fields with a button beside them is a form and behaves like one.
//
// Nothing here validates a number. An invalid value sits in its field until it is submitted and
// is then refused by the server, which is the only holder of the bounds (D45 point 2); a copy of
// them in this file would be a second source of truth for one rule and would put a sentence
// written here in front of the reader instead of the server's own, which names the parameter,
// the value received and the accepted range.
//
// It renders only once a snapshot has landed. Before that there is no effective window to state
// and the fields would be a pair of empty boxes whose apply could produce nothing but a refusal,
// which is an invitation rather than a control.
function windowHtml() {
  if (!S.hasData) return ''
  const d = S.windowDraft
  const field = function (id, key, label) {
    return '<input id="' + id + '" class="win-in" type="text" inputmode="numeric" autocomplete="off"'
      + ' aria-label="' + label + '" title="' + label + '" placeholder="' + label + '"'
      + ' value="' + esc(d[key]) + '">'
  }
  return '<span class="cell" title="The window the timeline and the git streams are both read over">'
    + '<span class="fg-dimmer">window</span>'
    + field('win-days', 'days', 'days') + '<span class="fg-dimmer">d</span>'
    + field('win-limit', 'limit', 'limit') + '<span class="fg-dimmer">events</span>'
    + '<button class="btn" data-act="window" title="Apply this window to both streams"'
    + (S.busy ? ' disabled' : '') + '>' + (S.windowBusy ? 'applying' : 'apply') + '</button></span>'
}

// A refused window is stated in a full-width strip under the header the control sits in. This is
// a correction and it is built to read as one: it names what was refused, repeats the server's
// own sentence, and says that the page did not move, which is the fact that separates it from
// every state below. It carries no retry, because fixing the number and applying again is the
// retry. The strip spans the page so the server's sentence wraps instead of stretching the header.
//
// The window it states as still showing is read from the snapshot on screen, not from the
// fields, which are holding the value that was just refused. The two disagree at exactly this
// moment and only here, so the sentence that resolves them belongs here and nowhere else.
function windowErrorHtml() {
  if (!S.windowError) return ''
  const w = timeline().window
  const showing = w && w.days != null && w.ceilingEvents != null
    ? 'Still showing the last window that was accepted: ' + esc(String(w.days)) + ' days, '
      + esc(String(w.ceilingEvents)) + ' events.'
    : 'The window on screen did not change.'
  return '<div class="strip">'
    + '<span class="strip-label">window refused</span>'
    + '<span class="msg fg-neg">' + esc(S.windowError) + '</span>'
    + '<span class="fg-dimmer">' + showing + '</span></div>'
}

// The header status cell of D43 point 5: the time of the last computation, the square that
// states what the page is doing, and the refresh control beside them. Refresh is the same
// GET /api/snapshot issued again, because the server keeps no cache and has no recompute verb.
// While a request is in flight the control says so and is disabled; loadSnapshot refuses a
// second one anyway, so two clicks can never put two requests in the air.
//
// The cells run left to right in widening scope: what the project is, how it is worked, the
// window it is read over, and the state of the reading.
function headerHtml() {
  const config = cfg()
  const p = config.project || {}
  const ex = config.execution || {}
  const teamCell = ex.workingModel === 'team' && ex.team
    ? 'team &#183; ' + ((ex.team.members || []).length) + ' + coordinator'
    : esc(ex.workingModel || '')
  return '<header class="top">'
    + '<h1 class="sans">' + esc(S.view) + '</h1>'
    + '<span class="top-sep">/</span>'
    + '<span class="top-sub">' + esc(subtitles()[S.view]) + '</span>'
    + '<div class="top-cells">'
    + (p.name ? '<span class="cell">' + esc(p.name) + (p.topology ? ' &#183; ' + esc(p.topology) : '') + '</span>' : '')
    + (teamCell ? '<span class="cell">' + teamCell + '</span>' : '')
    + windowHtml()
    + '<span class="cell"><span class="sq ' + statusSquare() + '"></span>'
    + esc(statusLabel())
    + '<button class="btn" data-act="refresh" title="Recompute the snapshot on the server"'
    + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'working' : 'refresh') + '</button></span>'
    + '</div></header>'
}

function loadingPanel() {
  return '<section class="panel"><div class="panel-head"><span class="eyebrow">loading</span>'
    + '<span class="sq active busy push"></span></div>'
    + '<div class="empty">Computing the snapshot on the server and fetching it.</div></section>'
}

// The whole main area when no snapshot has ever loaded. It names the request that failed and
// repeats the message the server sent, because that message is the only diagnosis the user
// gets: there is no island behind this page and no stale copy to show instead.
function errorPanel() {
  return '<section class="panel"><div class="panel-head"><span class="eyebrow">no data</span>'
    + '<span class="panel-meta fg-neg">' + esc(S.errorRoute || 'the request') + ' failed</span></div>'
    + '<div class="pad prose">'
    + 'The dashboard could not load its data, so there is nothing to show. This page carries no '
    + 'embedded copy to fall back on: the server computes the data on every request.</div>'
    + '<div class="pad quote sep">'
    + esc(S.error || 'the request failed and said nothing about why') + '</div>'
    + '<div class="pad tools sep">'
    + '<button class="btn" data-act="refresh"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'retrying' : 'retry') + '</button>'
    + '<span class="fg-dimmer small">If the server is not running, start it with /major-tom:dashboard.</span>'
    + '</div></section>'
}

// A failed refresh over a snapshot that did load is a different situation: blanking a good
// view because a later request failed would destroy information the user still has. The
// failure is stated above the view it did not manage to replace.
function errorBanner() {
  return '<section class="panel banner">'
    + '<span class="fg-neg small">' + esc(S.errorRoute || 'the request') + ' failed</span>'
    + '<span class="msg fg-dim small">' + esc(S.error) + '</span>'
    + '<span class="fg-dimmer small">Showing the last snapshot that loaded.</span>'
    + '<button class="btn" data-act="refresh"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'retrying' : 'retry') + '</button></section>'
}

function mainBody() {
  if (!S.hasData) return S.status === 'failed' ? errorPanel() : loadingPanel()
  if (S.view === 'knowledge') syncBody()
  return (S.status === 'failed' ? errorBanner() : '') + VIEW_FN[S.view]()
}

// Keeps the fetched body in step with the selected file. Called from renderMain rather than
// from the view, so views stay pure, and idempotent: it only issues a request when the
// selected file's id is not the one already requested. A refresh resets bodyStatus to idle,
// which is what makes the displayed body reload with the rest of the data.
function syncBody() {
  const list = files()
  const f = list[S.file] || list[0]
  const id = f && typeof f.id === 'string' && f.id !== '' ? f.id : ''
  if (!id) {
    if (S.bodyStatus === 'noid' && S.bodyId === '') return
    S.bodySeq += 1
    S.bodyId = ''
    S.bodyStatus = 'noid'
    S.bodyText = ''
    S.bodyError = ''
    return
  }
  if (id === S.bodyId && S.bodyStatus !== 'idle') return
  requestBody(id)
}

function requestBody(id) {
  S.bodySeq += 1
  S.bodyId = id
  S.bodyStatus = 'loading'
  S.bodyText = ''
  S.bodyError = ''
  const seq = S.bodySeq
  fetchKnowledgeBody(id).then(function (r) {
    // Only the request issued last may write here. Clicking through files faster than the
    // server answers leaves earlier requests in flight, and one of them landing afterwards
    // would put one file's body under another file's name. Comparing sequence numbers rather
    // than ids also covers re-selecting the same file, where the ids would match and a stale
    // failure could still overwrite a fresh success.
    if (seq !== S.bodySeq) return
    if (!r.ok) {
      S.bodyStatus = 'failed'
      S.bodyError = r.error
    } else if (r.data === null || typeof r.data !== 'object' || typeof r.data.body !== 'string') {
      S.bodyStatus = 'failed'
      S.bodyError = 'the server answered ' + r.status + ' without a body for this file'
    } else if (typeof r.data.id === 'string' && r.data.id !== id) {
      S.bodyStatus = 'failed'
      S.bodyError = 'the server answered with the body of a different file'
    } else {
      S.bodyStatus = 'ready'
      S.bodyText = r.data.body
    }
    renderMain()
  })
}

// The two window fields, bound after every render because assigning innerHTML destroyed the
// previous pair along with their listeners.
//
// Typing stores the draft and renders nothing. That is the deliberate half: the git filter
// beside it re-renders on every keystroke because it filters data the page already holds, while
// a keystroke here changes nothing that is on screen until the window is applied, so re-rendering
// would only cost the caret its place and force the focus dance that filter needs. It also means
// a reader typing "365" issues no request at all until they submit.
function bindWindowFields() {
  const bind = function (id, key) {
    const el = document.getElementById(id)
    if (!el) return
    el.addEventListener('input', function (e) { S.windowDraft[key] = e.target.value })
    el.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return
      S.windowDraft[key] = e.target.value
      applyWindow()
    })
  }
  bind('win-days', 'days')
  bind('win-limit', 'limit')
}

// The main area is a fixed header, the refusal strip when there is one, and the scrolling body
// the view is rendered into.
function renderMain() {
  document.getElementById('main').innerHTML =
    headerHtml() + windowErrorHtml() + '<div class="view">' + mainBody() + '</div>'
  bindWindowFields()
  const q = document.getElementById('git-q')
  if (q) {
    q.addEventListener('input', function (e) {
      S.query = e.target.value
      renderMain()
      const q2 = document.getElementById('git-q')
      q2.focus()
      q2.setSelectionRange(q2.value.length, q2.value.length)
    })
  }
}

function render() {
  document.title = 'Major Tom: ' + ((cfg().project || {}).name || 'dashboard')
  document.getElementById('app').classList.toggle('collapsed', !S.rail)
  renderRail()
  renderMain()
}

// The fields follow the snapshot, never a constant: the window a landed snapshot reports is the
// effective one the server applied (D45), so reading the control tells the reader what is on
// screen. A snapshot from a producer older than the timeline key states no window at all, and
// the fields then say so by being empty rather than by inventing a number this page does not
// know.
function syncWindowDraft() {
  const w = timeline().window
  S.windowDraft = {
    days: w && w.days != null ? String(w.days) : '',
    limit: w && w.ceilingEvents != null ? String(w.ceilingEvents) : ''
  }
}

// The load, the refresh, the retry and a window change are one function, because on the server
// they are one request: GET /api/snapshot recomputes every time and there is no separate
// recompute verb (D43 point 5). The busy flag is what stops overlapping requests, for the window
// control exactly as for the refresh one; the disabled controls are only the visible half of it.
//
// `requested` tells the four apart where they differ. Undefined means carry the window already
// in force, which is the boot (none), a refresh and a retry; an object means the reader submitted
// that window. The distinction is what decides how a refusal is read, below.
function loadSnapshot(requested) {
  if (S.busy) return
  const win = requested === undefined ? S.window : requested
  S.busy = true
  S.windowBusy = requested !== undefined
  // The previous refusal is about a value that is no longer the one being asked for.
  S.windowError = ''
  render()
  fetchSnapshot(win).then(function (r) {
    S.busy = false
    S.windowBusy = false
    if (r.ok) {
      try {
        setData(r.data)
        S.hasData = true
        S.status = 'ready'
        S.error = ''
        S.errorRoute = ''
        // Only an accepted window becomes the one in force, so a refused one never quietly
        // rides along on the next refresh. It stays null until the reader chooses, which is
        // what keeps a reload on the configured default.
        S.window = win
        syncWindowDraft()
        // The bodies on the server may have moved with the rest of the data, so whatever is
        // on screen is re-fetched rather than kept.
        S.bodyStatus = 'idle'
      } catch (e) {
        S.status = 'failed'
        S.errorRoute = 'GET ' + r.route
        S.error = 'the response could not be read as a snapshot (' + (e && e.message ? e.message : String(e)) + ')'
      }
    } else if (win !== null && r.status === 400) {
      // The line between a correction and a failure of the page, which is the one judgement in
      // this control. A 400 answering a request that carried a window is the server refusing an
      // input the reader typed: the repository is fine, the server is fine, the snapshot on
      // screen is exactly as valid as it was a second ago, and the single thing that has to
      // change is a number in a field a few pixels away. Blanking the page into the D48 error
      // state would destroy a good view to report a typo, and would offer a retry of the very
      // request that was refused. So this touches none of the page's error state: not `status`,
      // not `error`, not `hasData`, and not the draft, which keeps the refused value so it can
      // be corrected in place. The message renders at the control.
      //
      // Routed on the request rather than on the status alone, deliberately. What makes a
      // refusal correctable is that the reader supplied the input that was refused, and the
      // window is the only input this page ever sends with a snapshot request. A 400 answering
      // a request that carried no window says something is wrong with a request the reader did
      // not compose, which is not correctable at this control and belongs in the states below.
      S.windowError = r.error
    } else {
      S.status = 'failed'
      S.errorRoute = 'GET ' + r.route
      S.error = r.error
    }
    render()
  })
}

// The submit of the window control: both numbers, one request, always. Reading them out of the
// draft here rather than off the two elements is what makes that true of every path into it,
// the button and the Enter key alike.
function applyWindow() {
  loadSnapshot({ days: S.windowDraft.days, limit: S.windowDraft.limit })
}

document.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const act = btn.getAttribute('data-act')
  const v = btn.getAttribute('data-v')
  if (act === 'view') { S.view = v; history.replaceState(null, '', '#/' + v); render() }
  else if (act === 'filter') { S.filter = v; renderMain() }
  else if (act === 'file') { S.file = Number(v); renderMain() }
  else if (act === 'cfgmode') { S.configMode = v; renderMain() }
  else if (act === 'refresh') { loadSnapshot() }
  else if (act === 'window') { applyWindow() }
  else if (act === 'bodyretry') { S.bodyStatus = 'idle'; renderMain() }
  else if (act === 'theme') {
    S.theme = S.theme === 'light' ? 'dark' : 'light'
    localStorage.setItem('mt-theme', S.theme)
    document.documentElement.dataset.theme = S.theme
    render()
  } else if (act === 'rail') {
    S.rail = !S.rail
    localStorage.setItem('mt-rail', S.rail ? '1' : '0')
    render()
  }
})

window.addEventListener('hashchange', function () {
  const h = (location.hash || '').replace(/^#\/?/, '')
  if (VIEWS.indexOf(h) !== -1) { S.view = h; render() }
})

document.documentElement.dataset.theme = S.theme
// The first render happens inside this call, before the fetch is issued, so the loading state
// is on screen while the request is in flight.
loadSnapshot()
})()
</script>
</body>
</html>
