name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Checks 11 and 12 judge the change, not the tree, so they need the base branch
          # to diff against. The default shallow clone has no base and both would skip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the YAML parser the OKF frontmatter check requires
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate manifests, skills, adapters, evidence, and style
        run: python .github/checks.py
